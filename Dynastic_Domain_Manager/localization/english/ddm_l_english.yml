l_english:
  decision_group_type_ddm_domain_management_group: "Dynastic Domain Management"
  ddm_domain_management_group: "Dynastic Domain Management"

  ddm_open_manager_decision: "Manage the Dynastic Realm"
  ddm_open_manager_decision_desc: "Open a standing dynastic administration for titles, succession, military infrastructure, and family policy."
  ddm_open_manager_decision_tooltip: "Open the Dynastic Domain Office. Actions are grouped into departments so I can work through several tasks without reopening the decision."
  ddm_open_manager_decision_confirm: "Open the Office"

  ddm_assess_dynasty_member_interaction: "Assess Dynastic Value"
  ddm_assess_dynasty_member_interaction_desc: "Have my household evaluate this dynasty member's blood, abilities, temperament, loyalty, and standing among the family."
  ddm_protect_dynasty_member_interaction: "Protect from Automation"
  ddm_protect_dynasty_member_interaction_desc: "Exclude this dynasty member from automated pruning and land-management actions."
  ddm_unprotect_dynasty_member_interaction: "Remove Protection"
  ddm_unprotect_dynasty_member_interaction_desc: "Allow this dynasty member to be considered normally by the manager again."
  ddm_favor_for_land_interaction: "Favor for Land"
  ddm_favor_for_land_interaction_desc: "Tell the dynastic office to strongly prefer this person when an appropriate title becomes available."
  ddm_never_grant_land_interaction: "Never Grant Land"
  ddm_never_grant_land_interaction_desc: "Prevent the automated land manager from granting this person titles."
  ddm_clear_land_preference_interaction: "Clear Land Preference"
  ddm_clear_land_preference_interaction_desc: "Remove special favor or exclusion from the land-distribution system."
  ddm_protect_holding_interaction: "Protect a Personal Holding"
  ddm_protect_holding_interaction_desc: "Choose one of my personally held counties or secondary baronies and lock it into the protected domain. The surplus distributor will never give away a manually protected holding. This title-picker can be opened from my own portrait or, as a fallback, from my current player heir; the character clicked is not the recipient of anything."
  ddm_unprotect_holding_interaction: "Unprotect a Personal Holding"
  ddm_unprotect_holding_interaction_desc: "Choose one of my manually protected holdings and return it to normal optimizer consideration. The title-picker can be opened from my portrait or my current player heir."
  ddm_prioritize_holding_for_distribution_interaction: "Prioritize a Holding for Distribution"
  ddm_prioritize_holding_for_distribution_interaction_desc: "Choose one of my own holdings and mark it as an intended sacrifice. Unless it is the capital or later protected, the surplus manager will shed this holding before merely optimizer-selected land."
  ddm_clear_holding_distribution_priority_interaction: "Clear Holding Distribution Priority"
  ddm_clear_holding_distribution_priority_interaction_desc: "Choose one of my holdings previously marked for distribution and remove that instruction."
  ddm_reserve_title_for_recipient_interaction: "Reserve a Title for This Candidate"
  ddm_reserve_title_for_recipient_interaction_desc: "Choose one of my subordinate titles and reserve it for this character. A valid reservation is processed before ordinary scoring. Crown Estate protection, the capital, religious-title restrictions, rank limits, and CK3's normal grant legality still apply."
  ddm_clear_title_reservation_interaction: "Clear a Title Reservation"
  ddm_clear_title_reservation_interaction_desc: "Choose a title currently reserved for this character and return it to normal scored allocation."

  ddm_manager.close: "That will do."
  ddm_manager.back: "Go back."
  ddm_manager.main: "Return to the main office."
  ddm_manager.continue_realm: "Continue with Realm & Titles."
  ddm_manager.continue_dynasty: "Continue with Dynasty & Succession."
  ddm_manager.continue_military: "Continue with Military & Construction."

  # Main compact office
  ddm_manager.0001.t: "The Dynastic Domain Office"
  ddm_manager.0001.desc: "The office has been divided into departments rather than forcing every order onto one page. My personal domain stands at #V [GetPlayer.GetDomainSize]#! holdings against a limit of #V [GetPlayer.GetDomainLimit]#!. My living dynasty numbers #V [GetPlayer.MakeScope.Var('ddm_dash_living_dynasty').GetValue|0]#!, with #V [GetPlayer.MakeScope.Var('ddm_dash_safe_county_recipients').GetValue|0]#! currently passing the county-recipient rules.\n\n#help Choose a department. Each action now returns to the relevant department instead of closing the interface, so several related orders can be issued in sequence.#!"
  ddm_manager.0001.a: "Realm & Titles"
  ddm_manager.0001.a.flavor: "Distribute holdings, organize the hierarchy, reclaim land, or inspect exactly what is blocking the domain plan."
  ddm_manager.0001.b: "Dynasty & Succession"
  ddm_manager.0001.b.flavor: "Plan around inheritance, review the family, refresh alliances, and clean up after succession."
  ddm_manager.0001.c: "Military & Construction"
  ddm_manager.0001.c.flavor: "Ask the military office what my domain supports and issue realm-wide building programs without clicking every holding."
  ddm_manager.0001.d: "Rules & Preferences"
  ddm_manager.0001.d.flavor: "Change land, succession, alliance, pruning, and treasury-reserve policies."

  # Realm & titles
  ddm_manager.1000.t: "Realm & Titles"
  ddm_manager.1000.desc: "My personal core is protected first. Any surplus holding is then judged against the entire eligible dynasty by perceived rightfulness, territorial legitimacy, capability, political safety and existing power. Succession can modify a score but never defines the recipient pool."
  ddm_manager.1000.a: "Run the full dynastic settlement."
  ddm_manager.1000.a.flavor: "Reclaim eligible non-dynastic titles, shed only the personal holdings I do not need, then place higher titles into a coherent dynastic hierarchy."
  ddm_manager.1000.b: "Distribute only my surplus holdings."
  ddm_manager.1000.b.flavor: "Before the first grant, force me to classify any personally held county or secondary barony I have never reviewed: Keep, Give Away, or Let the Office Decide. Then stop as soon as my actual domain size reaches its limit."
  ddm_manager.1000.c: "Organize duchies and kingdoms."
  ddm_manager.1000.c.flavor: "Promote suitable local dynasts where possible without stacking dangerous personal power."
  ddm_manager.1000.d: "Reclaim non-dynastic lands."
  ddm_manager.1000.d.flavor: "Return eligible titles beneath me from non-dynastic rulers, then settle the resulting excess immediately."
  ddm_manager.1000.e: "Preview the domain plan and blockers."
  ddm_manager.1000.e.flavor: "Make no title changes. Show what the manager can distribute, why it might stop, and which holding it would sacrifice first."

  ddm_manager.0100.t: "The Realm Settled"
  ddm_manager.0100.desc: "The clerks complete the settlement. #V [GetPlayer.MakeScope.Var('ddm_last_titles_reclaimed').GetValue|0]#! titles were reclaimed from non-dynastic hands, #V [GetPlayer.MakeScope.Var('ddm_last_baronies_granted').GetValue|0]#! secondary baronies and #V [GetPlayer.MakeScope.Var('ddm_last_counties_granted').GetValue|0]#! counties were distributed, #V [GetPlayer.MakeScope.Var('ddm_last_duchies_granted').GetValue|0]#! duchies were placed, and #V [GetPlayer.MakeScope.Var('ddm_last_kingdoms_granted').GetValue|0]#! kingdoms were placed.\n\n#help If I remain above the domain limit, use the Preview and Blockers report. It distinguishes a lack of distributable holdings from a lack of safe recipients.#!"
  ddm_manager.0101.t: "Surplus Holdings Distributed"
  ddm_manager.0101.desc: "The office began with #V [GetPlayer.MakeScope.Var('ddm_last_distribution_start_surplus').GetValue|0]#! holdings outside my chosen personal estate and queued #V [GetPlayer.MakeScope.Var('ddm_last_titles_queued').GetValue|0]#! transferable holdings. It granted #V [GetPlayer.MakeScope.Var('ddm_last_baronies_granted').GetValue|0]#! secondary baronies and #V [GetPlayer.MakeScope.Var('ddm_last_counties_granted').GetValue|0]#! counties, then placed #V [GetPlayer.MakeScope.Var('ddm_last_duchies_granted').GetValue|0]#! duchies and #V [GetPlayer.MakeScope.Var('ddm_last_kingdoms_granted').GetValue|0]#! kingdoms. I now personally hold #V [GetPlayer.GetDomainSize]#! holdings; my protected-domain target is #V [GetPlayer.MakeScope.Var('ddm_protected_domain_target').GetValue|0]#!, while vanilla permits up to #V [GetPlayer.GetDomainLimit]#!.\n\nAt the rank directly below my highest title, the office retained #V [GetPlayer.MakeScope.Var('ddm_last_top_rank_retained').GetValue|0]#! titles for me—the strongest 40% by military strength per county held—and distributed the rest through the dynastic hierarchy.\n\n#help There is no finite per-person county quota. Every legally eligible dynast can continue receiving land; domain size, same-batch grants and excessive military strength reduce rightfulness instead of exhausting the recipient pool. The run ends only at my selected protected-domain target or when no unprotected title can mechanically be transferred.#!\n\nIf a surplus remains, the office recorded #V [GetPlayer.MakeScope.Var('ddm_last_baronies_left').GetValue|0]#! queued secondary baronies and #V [GetPlayer.MakeScope.Var('ddm_last_titles_left').GetValue|0]#! queued counties after the pass."
  ddm_manager.0101.stalled: "\n\n#N Some unprotected holdings could not be mechanically transferred.#! The office did not intentionally stop at the vanilla domain limit. If my personal domain remains above the protected target, these are genuine transfer/eligibility failures and should be investigated."
  ddm_manager.0102.t: "The Higher Titles Ordered"
  ddm_manager.0102.desc: "The office placed #V [GetPlayer.MakeScope.Var('ddm_last_duchies_granted').GetValue|0]#! duchies and #V [GetPlayer.MakeScope.Var('ddm_last_kingdoms_granted').GetValue|0]#! kingdoms. Titles directly below my own rank are treated specially: I retain the strongest 40% by military strength per county held, and the remaining 60% are assigned to the most territorially rightful dynasts. Lower intermediary titles are organized down the hierarchy."
  ddm_manager.0103.t: "Non-Dynastic Titles Reclaimed"
  ddm_manager.0103.desc: "The office reclaimed #V [GetPlayer.MakeScope.Var('ddm_last_titles_reclaimed').GetValue|0]#! eligible titles from outside the dynasty and then redistributed personal excess according to the standing domain rules."

  ddm_manager.1010.t: "Domain Plan: Preview & Blockers"
  ddm_manager.1010.desc: "The preview models dynasty-wide rightful-ruler allocation. It separates protected personal holdings from distributable surplus and shows whether legally safe dynastic recipients exist. Succession-signaled characters are tracked only as modifiers or for the narrow vanilla grant-gate bypass."
  ddm_manager.1010.status_ok: "\n#P No domain action is required: I am already at or below the limit.#!"
  ddm_manager.1010.status_stale_plan: "\n#N Player decision required: my current domain limit differs from the limit under which the last personal-domain plan was recorded. DDM will restart the holding-by-holding review rather than guess which additional holding should enter or leave my core.#!"
  ddm_manager.1010.status_unreviewed: "\n#N Player decision required: I still have #V [GetPlayer.MakeScope.Var('ddm_dash_unclassified_domain_count').GetValue|0]#! personally held holdings that I have never classified. DDM will not give any of them away until I explicitly choose KEEP, GIVE AWAY, or LET THE OFFICE DECIDE.#!"
  ddm_manager.1010.status_too_many_locks: "\n#N Primary blocker: more holdings are hard-protected than my domain limit can support. Remove at least one manual lock or disable Absolute Core before expecting the manager to reach the limit.#!"
  ddm_manager.1010.status_no_recipient: "\n#N Primary blocker: the eligible dynasty currently contains no legally safe recipient for this surplus title. Check dynasty eligibility, gender-law alignment, realm-integrity and power-safety settings.#!"
  ddm_manager.1010.status_no_holding: "\n#N Primary blocker: no personally held barony or county is legally distributable under the current core rule. Absolute Core protection may be the reason.#!"
  ddm_manager.1010.status_ready: "\n#P The office has distributable land.#! Each title will be assigned to the highest-scoring eligible dynast at that moment, using family regard, territorial legitimacy, capability, safety and existing power. Succession is only a modifier."
  ddm_manager.1010.next_barony: "\nNext secondary barony the optimizer would shed: #V [ddm_preview_next_barony.GetName]#!."
  ddm_manager.1010.next_county: "\nNext county the optimizer would shed: #V [ddm_preview_next_county.GetName]#!."
  ddm_manager.1010.best_heir: "\nHighest-ranked legal heir right now: #V [ddm_preview_best_heir.GetName]#!."
  ddm_manager.1010.second_heir: " Next legal-heir alternative: #V [ddm_preview_second_heir.GetName]#!."
  ddm_manager.1010.a: "Carry out the surplus plan now."
  ddm_manager.1010.a.flavor: "If I have any unreviewed holdings, ask me what to do with them before granting anything. Then obey my protected core and distribution priorities, use legal partition heirs first, and stop at the actual domain limit."
  ddm_manager.1010.b: "Configure the protected domain."
  ddm_manager.1010.b.flavor: "Choose the exact holdings I want to keep, one by one. The optimizer may advise me, but it no longer substitutes its judgment for an explicit player choice."

  ddm_manager.1020.t: "Choose My Personal Domain"
  ddm_manager.1020.desc: "The office cannot know which lands I personally care about unless I tell it. This screen therefore distinguishes #V my orders#! from #V the optimizer's advice#!.\n\n#P Protected by my order:#! [GetPlayer.MakeScope.Var('ddm_dash_manual_core_count').GetValue|0]\n#N Ordered out first:#! [GetPlayer.MakeScope.Var('ddm_dash_manual_shed_count').GetValue|0]\n#V Explicitly left to the office:#! [GetPlayer.MakeScope.Var('ddm_dash_manual_neutral_count').GetValue|0]\n#V Office-recommended core:#! [GetPlayer.MakeScope.Var('ddm_dash_auto_core_count').GetValue|0]\n\n#help My realm capital is always protected. The safest method is the first button: DDM will show each other personally held county or secondary barony and ask me to KEEP it, GIVE IT AWAY, or LET THE OFFICE DECIDE. If I protect exactly as many holdings as my domain limit allows, every remaining unclassified holding is automatically marked for distribution. Newly conquered holdings have no classification, so the next surplus run asks me about them before granting anything.#!"
  ddm_manager.1020.a: "Choose my holdings one by one."
  ddm_manager.1020.a.flavor: "Reset the old plan and walk through my personal domain. I—not the optimizer—decide which holdings are sacred, disposable, or left to administrative judgment."
  ddm_manager.1020.b: "Accept the office's recommended core."
  ddm_manager.1020.b.flavor: "Explicitly lock the optimizer's current best holdings up to my domain limit. This is a player command, not an automatic assumption."
  ddm_manager.1020.c: "Protect my capital-duchy counties."
  ddm_manager.1020.c.flavor: "Add every personally held county in my capital's de jure duchy to the protected core."
  ddm_manager.1020.d: "Protect my Men-at-Arms stationing counties."
  ddm_manager.1020.d.flavor: "Add every personally held county currently hosting one of my stationed Men-at-Arms regiments to the protected core."
  ddm_manager.1020.e: "Reset all holding choices."
  ddm_manager.1020.e.flavor: "Erase every Keep, Give Away, and Let the Office Decide classification except the automatic protection of my realm capital. The next surplus run will ask me again."

  ddm_manager.1021.t: "Keep or Surrender [scope:ddm_core_candidate.GetName]?"
  ddm_manager.1021.desc: "This is an actual order for #V [scope:ddm_core_candidate.GetName]#!, not an inferred preference.\n\nProtected so far: #V [GetPlayer.MakeScope.Var('ddm_dash_manual_core_count').GetValue|0]#! of my current domain limit of #V [GetPlayer.GetDomainLimit]#!.\nMarked to leave first: #V [GetPlayer.MakeScope.Var('ddm_dash_manual_shed_count').GetValue|0]#!.\nLeft to the office: #V [GetPlayer.MakeScope.Var('ddm_dash_manual_neutral_count').GetValue|0]#!.\n\n#help KEEP makes this holding absolutely unavailable to automatic distribution. GIVE AWAY pushes it to the front of the surplus queue. LET THE OFFICE DECIDE records that I deliberately delegated this particular holding; only then may DDM use development, buildings, Men-at-Arms stationing and other retention factors to decide its fate.#!"
  ddm_manager.1021.recommend_keep: "\n#P Office advice: KEEP.#! On the current retention formula this holding ranks inside the recommended personal core."
  ddm_manager.1021.recommend_shed: "\n#N Office advice: DISPENSABLE.#! On the current retention formula this holding falls outside the recommended personal core."
  ddm_manager.1021.maa: "\n#V Military note:#! one of my Men-at-Arms regiments is stationed here."
  ddm_manager.1021.capital_duchy: "\n#V Core-region note:#! this county lies in my realm capital's de jure duchy."
  ddm_manager.1021.a: "KEEP [scope:ddm_core_candidate.GetName]."
  ddm_manager.1021.a.flavor: "Hard-protect this holding. DDM may never grant it automatically while I hold it."
  ddm_manager.1021.b: "GIVE AWAY [scope:ddm_core_candidate.GetName]."
  ddm_manager.1021.b.flavor: "Mark this holding as a priority sacrifice. If I remain over the domain limit, DDM should shed it before merely neutral holdings."
  ddm_manager.1021.c: "Let the office decide this holding."
  ddm_manager.1021.c.flavor: "Record that I deliberately delegate this holding's fate to the optimizer."
  ddm_manager.1021.d: "Let the office decide all remaining holdings."
  ddm_manager.1021.d.flavor: "Stop the one-by-one review. Everything I have not explicitly protected or ordered away becomes neutral and may be ranked by the optimizer."

  ddm_manager.1022.t: "My Domain Orders Are Recorded"
  ddm_manager.1022.desc: "The office now has actual instructions rather than having to guess.\n\n#P Protected holdings:#! #V [GetPlayer.MakeScope.Var('ddm_dash_manual_core_count').GetValue|0]#!\n#N Priority sacrifices:#! #V [GetPlayer.MakeScope.Var('ddm_dash_manual_shed_count').GetValue|0]#!\n#V Delegated to the optimizer:#! #V [GetPlayer.MakeScope.Var('ddm_dash_manual_neutral_count').GetValue|0]#!\nCurrent domain: #V [GetPlayer.GetDomainSize]#!/#V [GetPlayer.GetDomainLimit]#!.\n\n#help The distributor now follows this order hierarchy: (1) never surrender an explicitly protected holding; (2) shed explicitly marked sacrifices first; (3) only for holdings I explicitly delegated, use the optimizer's retention formula. New personally held holdings are unclassified and will trigger this review before the next direct surplus distribution.#!"
  ddm_manager.1022.a: "Proceed with the recorded realm action."
  ddm_manager.1022.a.flavor: "Use the personal-domain orders I just recorded, then resume the distribution or full-settlement action that sent me here."
  ddm_manager.1022.b: "Preview the plan before granting anything."
  ddm_manager.1022.b.flavor: "Return to Preview & Blockers with these exact holding orders recorded."
  ddm_manager.1022.c: "Review every holding again."
  ddm_manager.1022.c.flavor: "Erase the plan and restart the one-by-one domain review."
  # Dynasty & succession
  ddm_manager.2000.t: "Dynasty & Succession"
  ddm_manager.2000.desc: "Inheritance and land grants are now treated as parts of the same system. Under partition, the default balancing policy first restricts surplus settlement to CK3's actual legal heirs, then uses merit, family regard, temperament and fairness to decide how much each receives. It can also maintain dynastic alliances and run a one-click cleanup after a ruler change.\n\n#help This office does not replace CK3's succession engine. It asks the engine who the heirs are, so Male Only, Female Only, disinheritance and similar eligibility rules shape the first-choice pool automatically.#!"
  ddm_manager.2000.a: "Open the succession briefing."
  ddm_manager.2000.a.flavor: "See my current law, leading heirs, projected title counts, and the rule the land manager is using."
  ddm_manager.2000.b: "Review and prune the living dynasty."
  ddm_manager.2000.b.flavor: "Assess the whole dynasty in one batch and act from the weakest qualifying member upward."
  ddm_manager.2000.c: "Refresh dynastic alliances."
  ddm_manager.2000.c.flavor: "Create missing alliances according to my alliance policy rather than requiring manual diplomacy after every grant."
  ddm_manager.2000.d: "Run post-succession cleanup."
  ddm_manager.2000.d.flavor: "Recheck my new personal domain, organize inherited higher titles, refresh dynastic alliances, and prepare a fresh succession report."

  ddm_manager.2010.t: "The Succession Ledger"
  ddm_manager.2010.desc: "The clerks identify #V [GetPlayer.MakeScope.Var('ddm_succession_heir_count').GetValue|0]#! current heirs in the character succession list, including #V [GetPlayer.MakeScope.Var('ddm_partition_secondary_heirs').GetValue|0]#! behind the primary heir.\n"
  ddm_manager.2010.law_confederate: "\nCurrent realm succession: #V Confederate Partition.#! #warning New same-rank titles may be created on death when the normal rules permit it, so an apparently tidy realm can still split.#!"
  ddm_manager.2010.law_partition: "\nCurrent realm succession: #V Partition.#! The realm is divided among eligible heirs without Confederate Partition's extra title creation."
  ddm_manager.2010.law_high_partition: "\nCurrent realm succession: #V High Partition.#! The primary heir receives a larger first share before the remainder is divided."
  ddm_manager.2010.law_single: "\nCurrent realm succession: #V Single Heir.#! Partition-provision heuristics matter far less under this law."
  ddm_manager.2010.law_other: "\nCurrent succession is not one of the standard partition laws recognized by this office; the report remains advisory."
  ddm_manager.2010.heir1: "\nFirst heir: #V [ddm_succession_heir_1.GetName]#! — currently heir to #V [GetPlayer.MakeScope.Var('ddm_primary_heir_expected_titles').GetValue|0]#! titles I hold."
  ddm_manager.2010.heir2: "\nSecond heir: #V [ddm_succession_heir_2.GetName]#! — currently heir to #V [GetPlayer.MakeScope.Var('ddm_second_heir_expected_titles').GetValue|0]#! titles I hold."
  ddm_manager.2010.heir3: "\nThird heir: #V [ddm_succession_heir_3.GetName]#! — currently heir to #V [GetPlayer.MakeScope.Var('ddm_third_heir_expected_titles').GetValue|0]#! titles I hold."
  ddm_manager.2010.a: "Change the succession-planning policy."
  ddm_manager.2010.a.flavor: "Decide whether title distribution should ignore heirs, simply protect the primary heir, provision secondary partition heirs, or favor the primary inheritance even more strongly."

  ddm_manager.succession_policy_1: "\nLand-manager policy: #V Ignore succession.#! Heir status does not affect recipient ranking beyond any separate player-heir protection."
  ddm_manager.succession_policy_2: "\nLand-manager policy: #V Protect the primary heir.#! The primary heir is strongly disfavored for automatic grants unless manually favored."
  ddm_manager.succession_policy_3: "\nLand-manager policy: #V Balance partition heirs.#! The de-duplicated current heirs of my held titles become the first-choice pool. Each grant is re-ranked using inheritable quality, adult merit where applicable, family regard, political temperament and a #V -65#! penalty for each title already received in the current batch. The primary heir is not automatically excluded, so two eligible sons can actually divide a large surplus rather than one being hidden behind heir protection."
  ddm_manager.succession_policy_4: "\nLand-manager policy: #V Maximize the primary inheritance.#! The same partition-aware behavior is used with the strongest intent to provision secondary heirs away from the core."

  ddm_manager.0104.t: "Dynastic Alliances Refreshed"
  ddm_manager.0104.desc: "The office created #V [GetPlayer.MakeScope.Var('ddm_last_alliances_created').GetValue|0]#! new alliances with landed dynasty members that fit the current alliance policy. Existing alliances were left untouched."
  ddm_manager.2020.t: "The New Reign Put in Order"
  ddm_manager.2020.desc: "The post-succession pass distributed #V [GetPlayer.MakeScope.Var('ddm_last_baronies_granted').GetValue|0]#! secondary baronies and #V [GetPlayer.MakeScope.Var('ddm_last_counties_granted').GetValue|0]#! counties, then placed #V [GetPlayer.MakeScope.Var('ddm_last_duchies_granted').GetValue|0]#! duchies and #V [GetPlayer.MakeScope.Var('ddm_last_kingdoms_granted').GetValue|0]#! kingdoms. Any configured dynastic-alliance refresh is deferred to one compact event on the following day instead of running inside the title-grant loop.\n\n#help This is intentionally a button rather than background automation: succession can be chaotic, and the player retains the final say over when the office reorganizes a new reign.#!"
  ddm_manager.2020.a: "Read the fresh succession ledger."

  # Dynasty review
  ddm_manager.0200.t: "Review the Living Dynasty"
  ddm_manager.0200.desc: "Every living member of my dynasty can be assessed — newborn, child, adolescent, adult, landed or landless. The office has now built a fixed register using the same values the action will use.\n\n#V [GetPlayer.MakeScope.Var('ddm_purge_candidate_count').GetValue|0]#! of #V [GetPlayer.MakeScope.Var('ddm_purge_living_total').GetValue|0]#! living dynasts are currently marked for action.\n"
  ddm_manager.purge_stage_1: "\nCurrent standard: #V Preservation — score below 40.#! Only severe liabilities fall beneath the line."
  ddm_manager.purge_stage_2: "\nCurrent standard: #V Lenient — score below 75.#! Weak lines are reviewed, but ordinary useful relatives usually survive."
  ddm_manager.purge_stage_3: "\nCurrent standard: #V Balanced — score below 110.#! #P Default.#! An average competent adult can survive without a special blood trait; good hereditary traits make survival progressively easier."
  ddm_manager.purge_stage_4: "\nCurrent standard: #V Selective — score below 155.#! The dynasty is expected to show either strong inherited quality, real governing merit, or a convincing combination."
  ddm_manager.purge_stage_5: "\nCurrent standard: #V High Standard — score below 210.#! Strong merit is required; no single named trait is mandatory."
  ddm_manager.purge_stage_6: "\nCurrent standard: #V Elite — score below 280.#! Exceptional inherited quality or exceptional demonstrated competence is expected."
  ddm_manager.purge_stage_7: "\nCurrent standard: #V Apex — score below 360.#! Only the dynasty's most valuable combinations of inheritance, merit and standing are likely to clear the line."
  ddm_manager.purge_method_1: "\nCurrent action: #V Disinherit only.#!"
  ddm_manager.purge_method_2: "\nCurrent action: #V Strip realm titles, then disinherit.#!"
  ddm_manager.purge_method_3: "\nCurrent action: #N Lethal purge — strip eligible realm titles, then execute.#!"
  ddm_manager.floor_0: "\nMinimum dynasty floor: #N None.#!"
  ddm_manager.floor_4: "\nMinimum dynasty floor: #V 4 living members.#!"
  ddm_manager.floor_8: "\nMinimum dynasty floor: #V 8 living members.#!"
  ddm_manager.floor_12: "\nMinimum dynasty floor: #V 12 living members.#!"
  ddm_manager.0200.a: "Choose the dynastic standard."
  ddm_manager.0200.a.flavor: "Set how demanding the evaluation should be before anyone is marked for action."
  ddm_manager.0200.b: "Choose what 'pruning' means."
  ddm_manager.0200.b.flavor: "Separate the quality threshold from the consequence: disinherit, strip and disinherit, or lethal action."
  ddm_manager.0200.c: "Review the order and proceed."
  ddm_manager.0200.c.flavor: "Show the current candidate count before the batch action begins."

  ddm_manager.0210.t: "Set the Dynastic Standard"
  ddm_manager.0210.desc: "The office no longer treats Divine Blood, Pure Blood, Genius, or any other single trait as a pass/fail gate. Every dynast receives one weighted score. For hereditary traits, the ledger copies vanilla Ruler Designer costs where Paradox supplies them; adult competence and family regard then contribute separately. #P Balanced is the default#! so a new 867 or 1066 dynasty does not begin under an impossible blood standard."
  ddm_manager.0210.a: "Preservation — threshold 40."
  ddm_manager.0210.b: "Lenient — threshold 75."
  ddm_manager.0210.c: "Balanced — threshold 110. (Default)"
  ddm_manager.0210.d: "Selective — threshold 155."
  ddm_manager.0210.e: "High Standard — threshold 210."
  ddm_manager.0210.f: "Elite — threshold 280."
  ddm_manager.0210.g: "Apex — threshold 360."

  ddm_manager.0220.t: "Define the Pruning Action"
  ddm_manager.0220.desc: "The ranking system and the action taken against those beneath it are separate. This lets the same dynastic assessment inform land and succession planning without requiring lethal action."
  ddm_manager.0220.a: "Disinherit those below the line."
  ddm_manager.0220.b: "Strip their realm titles and disinherit them."
  ddm_manager.0220.c: "Strip their realm titles and execute them."

  ddm_manager.0230.t: "The List Before Me"
  ddm_manager.0230.desc: "The register contains #V [GetPlayer.MakeScope.Var('ddm_purge_candidate_count').GetValue|0]#! targets out of #V [GetPlayer.MakeScope.Var('ddm_purge_living_total').GetValue|0]#! living dynasts. #V [GetPlayer.MakeScope.Var('ddm_purge_standard_survivor_count').GetValue|0]#! currently clear the chosen score threshold. #V [GetPlayer.MakeScope.Var('ddm_purge_protected_count').GetValue|0]#! are excluded because they are me, manually protected, or the protected player heir; #V [GetPlayer.MakeScope.Var('ddm_purge_already_satisfied_count').GetValue|0]#! already satisfy the chosen consequence (for example, already disinherited).\n\n#help No named blood trait is required. A Genius contributes 240 vanilla Ruler Designer points, Intelligent 160 and Quick 80; Herculean/Amazonian 180, Robust 120 and Hale 60; Beautiful 120, Pretty/Handsome 80 and Comely 40. Education tiers contribute their vanilla 0/20/40/80/150 costs. Adult skill, political safety and family regard are separate contextual measures rather than invented 'official trait' weights.#!\n\n#warning The register is fixed before execution. The action will not recalculate family regard and quietly change the list after I confirm it.#!"
  ddm_manager.0230.a: "Carry out the dynastic review."
  ddm_manager.0230.a.flavor: "One order processes the entire eligible list; I will not be forced back through the menu for every relative."
  ddm_manager.0230.b: "Not yet."

  ddm_manager.0240.t: "The Dynastic Review Concluded"
  ddm_manager.0240.desc: "The order began with #V [GetPlayer.MakeScope.Var('ddm_purge_candidate_count').GetValue|0]#! registered targets. The office acted against #V [GetPlayer.MakeScope.Var('ddm_last_purged').GetValue|0]#! of them. #V [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('ddm_purge_unprocessed_value')|0]#! remain unprocessed, normally because the minimum living-dynasty floor stopped the purge. Any reclaimed holdings were then returned to the normal domain plan."
  ddm_manager.0240.a: "Review the dynasty office again."

  ddm_manager.0300.t: "A Dynastic Assessment"
  ddm_manager.0300.desc: "The clerks set [ddm_subject.GetName]'s file before me.\n\nTrait Value: #V [GuiScope.SetRoot(ddm_subject.MakeScope).ScriptValue('ddm_quality_trait_value')|0]#!\nEducation Value: #V [GuiScope.SetRoot(ddm_subject.MakeScope).ScriptValue('ddm_education_trait_value')|0]#!\nGovernance Merit: #V [GuiScope.SetRoot(ddm_subject.MakeScope).ScriptValue('ddm_governance_merit_value')|0]#!\nOverall Dynastic Value: #V [GuiScope.SetRoot(ddm_subject.MakeScope).ScriptValue('ddm_dynastic_value')|0]#!\nPolitical Safety: #V [GuiScope.SetRoot(ddm_subject.MakeScope).AddScope('ddm_actor',GetPlayer.MakeScope).ScriptValue('ddm_loyalty_value')|0]#!\nFamily Regard: #V [ddm_subject.MakeScope.Var('ddm_family_regard').GetValue|0]#!\n\n#help Trait Value copies vanilla Ruler Designer costs for congenital/physical traits where CK3 supplies them. Education Value likewise uses the official education-tier costs: 0/20/40/80/150. Governance Merit then adds a modest developed-skill component; CK3 has no official universal ruler-merit formula, so that part is deliberately a transparent DDM policy rather than being mislabeled as vanilla. Political Safety reads CK3's own AI personality axes — honor, compassion, rationality, greed, vengefulness, boldness and energy — plus the character's relationship to me.#!"

  # Military & Construction
  ddm_manager.3000.t: "Military & Construction"
  ddm_manager.3000.desc: "The marshal audits the Men-at-Arms I actually maintain by their engine-defined combat families and consults Paradox's own counter-synergy logic before recommending the next role to add. Cultural and special regiments automatically count as their real base type; a Bush Hunter, Longbowman or Vigman is still recognized as an Archer-family regiment without a culture-specific branch. Buildings are considered only after the roster recommendation.\n\n#help DDM no longer turns vanilla AI purchase weights into fake combat scores. Those weights can include large substitution penalties (for example, discouraging generic Bowmen when a cultural Archer is available). The adviser now uses actual roster structure plus vanilla counter-synergy signals.#!"
  ddm_manager.3000.a: "Audit my actual Men-at-Arms roster."
  ddm_manager.3000.a.flavor: "Show the recruitable regiments the office can identify, the literal regiments I already own, the best next addition, and the counter logic behind it."
  ddm_manager.3000.b: "Open the construction office."
  ddm_manager.3000.b.flavor: "Issue one bulk building order across eligible personally held provinces while protecting a treasury reserve."
  ddm_manager.3000.c: "Build around my stationed Men-at-Arms."
  ddm_manager.3000.c.flavor: "Support the regiment actually stationed in each holding first. A roster recommendation is no longer allowed to turn an Archer army into a Stable-building program."

  ddm_manager.3010.t: "Men-at-Arms Roster Audit"
  ddm_manager.3010.desc: "#bold Men-at-Arms roster audit#!\nPersonal regiments scanned: #V [GetPlayer.MakeScope.Var('ddm_maa_personal_regiment_count').GetValue|0]#!.\n\n#bold Combat families currently present#!"

  ddm_manager.3010.plan_archer_pike: "\n\n#P Recommended next role: Pikemen.#!\nYour current roster is Archer-heavy and lacks a Pike-family screen. Paradox's own roster-synergy logic adds value to Pikemen when an Archer core has formed; DDM applies that same relationship one regiment earlier when the ruler is still operating with a tiny three-slot roster. Recruit the #bold best Pike-family unit actually available to your culture#! rather than assuming generic Pikemen are always the best literal unit.\n\n#help This is a roster-structure recommendation, not a claim that every Archer cultural unit has identical counters. Special MaA can differ from their generic family.#!"
  ddm_manager.3010.plan_archer_core: "\n\n#P Recommendation: keep the Archer core and compare actual Archer-family options.#!\nYou already have an Archer core plus Pike cover. Do not diversify merely for symmetry. Prefer the strongest recruitable cultural/special Archer-family regiment available to you, unless a specific enemy or terrain profile gives another family a clear purpose. Reserve later capacity for siege when appropriate."
  ddm_manager.3010.plan_cavalry_answer: "\n\n#P Recommended next role: Heavy Infantry.#!\nYour roster is cavalry-heavy and lacks Heavy Infantry. This follows Paradox's own counter-synergy logic: Heavy Infantry is weighted upward once cavalry dominates the roster. Recruit the strongest Heavy-Infantry-family unit your culture can actually field; DDM does not assume Armored Footmen are superior to a cultural replacement."
  ddm_manager.3010.plan_skirmisher_answer: "\n\n#P Recommended next role: Light Cavalry.#!\nYour roster is Skirmisher-heavy and lacks Light Cavalry. This mirrors vanilla's counter-synergy rule. If your culture has a special Light-Cavalry-family regiment, prefer the actual special option rather than the generic Light Horsemen entry."
  ddm_manager.3010.plan_mixed: "\n\n#P No forced purchase.#!\nThe current roster does not produce a strong vanilla counter-synergy signal. DDM will not invent a numerical winner. Compare the literal recruitable MaA shown in the military panel, favor superior cultural replacements within a needed family, and add siege capacity when the combat roster is sufficiently established.\n\n#help CK3 script can count your real regiment base types and call vanilla script values, but it does not expose every recruitable MaA definition as an iterable runtime object with raw damage, toughness, stack size and counter table. Because of that engine limitation, DDM refuses to fabricate an exact cross-culture stat score for arbitrary future/DLC units.#!"

  ddm_manager.3010.a: "Build holdings around the regiments actually stationed there."
  ddm_manager.3010.a.flavor: "Build infrastructure around the actual regiments stationed in my holdings. The roster audit no longer fabricates a global combat-family score."
  ddm_manager.3010.b: "Open the construction office instead."

  ddm_manager.3100.t: "The Construction Office"
  ddm_manager.3100.desc: "The works office can add tier-I military buildings across my directly held provinces in one order. It only uses free regular building slots, checks the corresponding vanilla terrain/holding requirements used by these building families, and stops spending once the treasury reserve would be crossed.\n"
  ddm_manager.reserve_0: "\nTreasury reserve: #N none.#!"
  ddm_manager.reserve_500: "\nTreasury reserve: #V 500 gold.#!"
  ddm_manager.reserve_1000: "\nTreasury reserve: #V 1,000 gold.#!"
  ddm_manager.reserve_2500: "\nTreasury reserve: #V 2,500 gold.#!"
  ddm_manager.reserve_5000: "\nTreasury reserve: #V 5,000 gold.#!"
  ddm_manager.3100.a: "Run the smart Men-at-Arms building program."
  ddm_manager.3100.a.flavor: "Prefer the regiment stationed in each holding; where none dictates the answer, follow the current realm-wide doctrine."
  ddm_manager.3100.b: "Choose one building type for the whole domain."
  ddm_manager.3100.b.flavor: "For example, order Military Camps everywhere they can legally fit rather than opening every holding by hand."
  ddm_manager.3100.c: "Set the construction treasury reserve."
  ddm_manager.3100.c.flavor: "Bulk construction will stop before spending into this protected amount."

  ddm_manager.3110.t: "Choose a Military Building Program"
  ddm_manager.3110.desc: "The office will scan every directly owned province and add the selected tier-I building wherever a free slot and its normal terrain/holding requirements permit. A province that already has that building line is skipped. The order stops spending at the protected treasury reserve.\n\n#help This is a bulk administrative action: eligible buildings are completed immediately and their base gold cost is charged immediately. It does not create hidden free buildings.#!"
  ddm_manager.3110.a: "Military Camps — ranged foot."
  ddm_manager.3110.a.flavor: "Build Military Camps where eligible to support Archers and Skirmishers."
  ddm_manager.3110.b: "Barracks — heavy foot."
  ddm_manager.3110.b.flavor: "Build Barracks where eligible to support Heavy Infantry and Pikemen."
  ddm_manager.3110.c: "Stables — cavalry."
  ddm_manager.3110.c.flavor: "Build Stables where eligible to support mounted Men-at-Arms."
  ddm_manager.3110.d: "Regimental Grounds — broad support."
  ddm_manager.3110.d.flavor: "Use the more expensive general military building where its terrain requirements permit."

  ddm_manager.3150.t: "Protect the Treasury"
  ddm_manager.3150.desc: "Bulk construction is convenient precisely because it can spend very quickly. The office therefore protects a fixed reserve. Each prospective project checks what remains above that reserve before it is approved."
  ddm_manager.3150.a: "No reserve."
  ddm_manager.3150.b: "Protect 500 gold."
  ddm_manager.3150.c: "Protect 1,000 gold."
  ddm_manager.3150.d: "Protect 2,500 gold."
  ddm_manager.3150.e: "Protect 5,000 gold."

  ddm_manager.3190.t: "The Building Program Completed"
  ddm_manager.3190.desc: "The office completed #V [GetPlayer.MakeScope.Var('ddm_last_buildings_constructed').GetValue|0]#! new military buildings and spent #V [GetPlayer.MakeScope.Var('ddm_last_gold_spent').GetValue|0]#! gold. #V [GetPlayer.MakeScope.Var('ddm_last_build_skipped_no_slots').GetValue|0]#! directly held provinces had no free regular building slot when examined, while #V [GetPlayer.MakeScope.Var('ddm_last_build_skipped_budget').GetValue|0]#! potential projects were halted by the protected treasury reserve.\n\n#help Terrain or holding-type ineligibility is silently skipped; the office will never force Military Camps, Barracks, Stables, or Regimental Grounds into terrain where their requirement trigger rejects them.#!"
  ddm_manager.3190.a: "Continue issuing construction orders."
  ddm_manager.3190.b: "Recalculate the Men-at-Arms doctrine."

  # Rules
  ddm_manager.0400.t: "Rules & Preferences"
  ddm_manager.0400.desc: "The old rules page tried to expose every switch at once. The standing orders are now separated by subject. None of these rules runs in the background; they govern what happens when I deliberately use the office."
  ddm_manager.0400.a: "Land distribution rules."
  ddm_manager.0400.a.flavor: "Eligible relatives, vassal power ceilings, the protected core, and succession-leak risk."
  ddm_manager.0400.b: "Succession & alliance rules."
  ddm_manager.0400.b.flavor: "How heir status changes land ranking, who receives automatic alliances, and whether the player heir is protected."
  ddm_manager.0400.c: "Dynasty-review rules."
  ddm_manager.0400.c.flavor: "Whose opinions count and how small the living dynasty is allowed to become."
  ddm_manager.0400.d: "Construction reserve."
  ddm_manager.0400.d.flavor: "Set how much gold bulk building programs must leave untouched."

  ddm_manager.0460.v19.t: "Recipient & Safety Rules"
  ddm_manager.0460.v19.desc: "These rules shape dynasty-wide rightfulness. Every legally usable dynast remains in the candidate universe; the family-scope choice changes House preference rather than excluding cadet branches. Personal-domain protection lives in the checkbox planner.\n"
  ddm_manager.0460.t: "Land Distribution Rules"
  ddm_manager.0460.desc: "These rules decide who may receive land and which parts of my personal domain the optimizer will sacrifice first.\n"
  ddm_manager.family_scope_1: "\nDynastic preference: #V Strong current-House preference.#! All legally usable cadet branches remain candidates."
  ddm_manager.family_scope_3: "\nDynastic preference: #V Entire Dynasty, with a modest current-House preference.#!"
  ddm_manager.family_scope_2: "\nDynastic preference: #V Entire Dynasty equally, including cadet branches.#!"
  ddm_manager.power_policy_1: "\nPower safety: #V Strict.#!"
  ddm_manager.power_policy_2: "\nPower safety: #V Balanced.#!"
  ddm_manager.power_policy_3: "\nPower safety: #V Relaxed.#!"
  ddm_manager.core_policy_1: "\nCore protection: #V Absolute — capital duchy, stationed-regiment counties, special-building counties, and the capital are never distributed.#!"
  ddm_manager.core_policy_2: "\nCore protection: #V Best-Effort — the capital is absolute; other core counties receive enormous retention priority but can be sacrificed if necessary to reach the limit.#!"
  ddm_manager.realm_integrity_on: "\nRealm-integrity heuristic: #V On — heavily penalize a candidate whose current primary heir is already a landed outsider.#!"
  ddm_manager.realm_integrity_off: "\nRealm-integrity heuristic: #N Off.#!"
  ddm_manager.0460.a: "Set eligible family."
  ddm_manager.0460.b: "Set vassal power safety."
  ddm_manager.0460.c: "Set core-domain protection."
  ddm_manager.0460.d: "Toggle succession-leak protection."

  ddm_manager.0470.t: "Succession & Alliance Rules"
  ddm_manager.0470.desc: "Succession is an influence on rightfulness, not a land-distribution pool. Gender-law alignment can still enforce hard Male Only/Female Only restrictions, while preference laws merely tilt the score. Automatic alliances remain a separate rule."
  ddm_manager.alliance_policy_0: "\nAlliance policy: #N Off.#!"
  ddm_manager.alliance_policy_1: "\nAlliance policy: #V Ally every landed dynasty recipient and all eligible landed dynasty vassals during a refresh.#!"
  ddm_manager.alliance_policy_2: "\nAlliance policy: #V Direct dynastic vassals only.#!"
  ddm_manager.alliance_policy_3: "\nAlliance policy: #V Dynastic dukes and above only.#!"
  ddm_manager.heir_protected: "\nPlayer heir: #V Protected from accidental automatic landing outside Balance Partition Heirs; pruning protection remains active.#!"
  ddm_manager.heir_unprotected: "\nPlayer heir: #N Treated like any other dynasty member.#!"
  ddm_manager.0470.a: "Set succession-planning policy."
  ddm_manager.0470.b: "Set automatic-alliance policy."
  ddm_manager.0470.c: "Toggle player-heir protection."
  ddm_manager.0470.d: "Toggle succession-gender alignment."
  ddm_manager.gender_alignment_on: "\nSuccession-gender alignment: #V On.#! Male/Female Only hard-filters automatic grants; Male/Female Preference gives the preferred sex a ranking bonus; Equal leaves gender neutral."
  ddm_manager.gender_alignment_off: "\nSuccession-gender alignment: #N Off.#! Vanilla grant legality still applies, but the manager does not add its own succession-law alignment."

  ddm_manager.0480.t: "Dynasty Review Rules"
  ddm_manager.0480.desc: "These settings control whose opinion contributes to family regard, the minimum living-dynasty safety floor, and an explanation of the weighted merit ledger. No named blood trait has a special pass/fail rule.\n"
  ddm_manager.regard_1: "\nFamily sentiment: #V Close and extended kin plus house/dynasty leadership.#!"
  ddm_manager.regard_2: "\nFamily sentiment: #V Entire living dynasty. #warning This is calculated only when deliberately requested because a very large dynasty requires many opinion checks.#!"
  ddm_manager.0480.a: "Set family-regard depth."
  ddm_manager.0480.b: "Set minimum surviving dynasty size."
  ddm_manager.0480.c: "How is dynastic merit scored?"
  ddm_manager.0481.t: "How the Ledger Weighs a Life"
  ddm_manager.0481.desc: "There is no single vanilla 'dynastic worth' statistic. For inherited quality, the office therefore uses the game's own Ruler Designer prices as the closest canonical comparison: Quick #V 80#!, Intelligent #V 160#!, Genius #V 240#!; Hale #V 60#!, Robust #V 120#!, Herculean/Amazonian #V 180#!; Comely #V 40#!, Pretty/Handsome #V 80#!, Beautiful #V 120#!; Pure-Blooded, Fecund, Strong and Shrewd #V 50#! each. The corresponding bad intellect and physique tiers count #N -15/-30/-45#!, bad beauty #N -10/-20/-30#!, while Giant is #V +20#!, Dull #N -20#!, Hunchbacked/Spindly/Wheezing #N -10#!, Lisping/Stuttering #N -5#!, Bleeder #N -20#!, Inbred #N -30#! and Weak #N -10#!. Genetic Melancholic/Lunatic/Possessed variants use #N -20/-15/-20#!. Vanilla zero-cost traits remain zero rather than receiving invented penalties.\n\nConsecrated Blood and Divine Blood are fame traits hidden from Ruler Designer, not superior genetic tiers. They therefore receive only small social values matching their vanilla effects instead of overwhelming the ledger.\n\nFor adults, demonstrated merit is added separately from traits: Diplomacy x2, Martial x2, Stewardship x3, Intrigue x1.5, Learning x2 and Prowess x0.5. Children receive a neutral developmental baseline plus modest parental-potential signals because their finished skills do not yet exist. Family regard contributes 15% to pruning value; title-grant ranking gives family consensus additional weight, and existing claims, political safety, succession need and de-jure coherence also matter.\n\n#help The trait prices are vanilla data. Education is not separately added at its Ruler Designer price because its skill bonuses already feed Governance Merit; doing both would double-count it. Personality traits likewise feed Political Safety through CK3's own AI personality axes. The skill multipliers, child-development rule, score thresholds and conversion of AI temperament into one political-safety number are DDM policy choices because CK3 supplies no universal ruler-merit formula.#!"
  ddm_manager.0481.a: "Return to the review rules."
  ddm_manager.0240.stalled: "\n#N Warning: the scripted selector stalled with registered targets remaining. If this appears, the error log should identify a scope/list failure.#!"

  ddm_manager.0410.t: "Who May Receive the Realm?"
  ddm_manager.0410.desc: "Cadet branches remain part of the dynasty. I can restrict settlement to my current House, use the whole dynasty while preferring my House, or treat every house equally."
  ddm_manager.0410.a: "Current House only."
  ddm_manager.0410.b: "Whole Dynasty — favor my House."
  ddm_manager.0410.c: "Whole Dynasty — equal treatment."

  ddm_manager.0420.t: "How Much Power Is Safe?"
  ddm_manager.0420.desc: "The office compares prospective vassals against my military strength and limits how much personal land each can accumulate. No rule can make rebellion literally impossible, but stricter settings create more, weaker dynasty rulers rather than a few oversized ones."
  ddm_manager.0420.a: "Strict — fragment power aggressively."
  ddm_manager.0420.b: "Balanced — preserve coherence without creating monsters."
  ddm_manager.0420.c: "Relaxed — allow stronger regional princes."

  ddm_manager.0430.t: "Whose Opinion Counts?"
  ddm_manager.0430.desc: "Family regard measures how the selected family circle currently feels about each candidate, and it influences both survival and elevation. Close-kin mode is much cheaper to calculate. Full-dynasty mode asks how every living dynast feels about every candidate before a deliberate review or mass land settlement. This is a selection-consensus measure, not a fabricated blanket opinion bonus: direct grants still apply CK3's normal received-title opinion to the recipient."
  ddm_manager.0430.a: "Use close and extended family."
  ddm_manager.0430.b: "Use the entire living dynasty."

  ddm_manager.0440.t: "The Minimum Living Dynasty"
  ddm_manager.0440.desc: "Even a very harsh standard can stop before the dynasty is hollowed out. The batch review ceases as soon as the selected floor would be crossed. Manually protected characters are never targeted."
  ddm_manager.0440.a: "No safety floor."
  ddm_manager.0440.b: "Never fall below 4 living members."
  ddm_manager.0440.c: "Never fall below 8 living members."
  ddm_manager.0440.d: "Never fall below 12 living members."

  ddm_manager.0450.t: "How Absolute Is the Core?"
  ddm_manager.0450.desc: "Absolute protection can make the domain limit mathematically unreachable. Best-Effort protection instead scores the capital duchy, stationed Men-at-Arms, special buildings, military infrastructure, and development as things to retain for as long as possible. The realm capital is always untouchable."
  ddm_manager.0450.a: "Absolute Core — never touch protected counties."
  ddm_manager.0450.b: "Best-Effort Core — reach the limit if possible."

  ddm_manager.0490.t: "Succession Influence"
  ddm_manager.0490.desc: "Succession does not determine who may receive conquered land. Neutral ignores inheritance in the allocation score; Respect Current Heir gives the current heir of a title a modest bonus; Preserve Primary Estate modestly deprioritizes the primary heir while they are expected to inherit the protected core."
  ddm_manager.0490.a: "Succession neutral."
  ddm_manager.0490.b: "Protect the primary heir."
  ddm_manager.0490.c: "Balance all legal partition heirs."
  ddm_manager.0490.d: "Maximize the primary inheritance."

  ddm_manager.0491.t: "Automatic Dynastic Alliances"
  ddm_manager.0491.desc: "A title grant does not need to end with another round of manual diplomacy. Choose how broadly the office should create alliances after grants and during alliance refreshes."
  ddm_manager.0491.a: "Do not create alliances automatically."
  ddm_manager.0491.b: "Ally all landed dynastic recipients."
  ddm_manager.0491.c: "Ally direct dynastic vassals only."
  ddm_manager.0491.d: "Ally dynastic dukes and above only."

  ddm_manager.3010.has_skirmishers: "\n• Skirmisher-family regiments present."
  ddm_manager.3010.has_archers: "\n• Archer-family regiments present."
  ddm_manager.3010.has_pikemen: "\n• Pikemen-family regiments present."
  ddm_manager.3010.has_heavy_infantry: "\n• Heavy-Infantry-family regiments present."
  ddm_manager.3010.has_light_cavalry: "\n• Light-Cavalry-family regiments present."
  ddm_manager.3010.has_heavy_cavalry: "\n• Heavy-Cavalry-family regiments present."
  ddm_manager.3010.has_archer_cavalry: "\n• Archer-Cavalry-family regiments present."
  ddm_manager.3010.has_camel_cavalry: "\n• Camel-Cavalry-family regiments present."
  ddm_manager.3010.has_elephant_cavalry: "\n• Elephant-Cavalry-family regiments present."
  ddm_manager.3010.has_gunpowder: "\n• Gunpowder-family regiments present."
  ddm_manager.3010.has_siege: "\n• Siege-weapon regiments present."
  ddm_manager.3010.plan_heavy_infantry_answer: "\n\n#P Recommended next role: Archers.#!\nYour roster is Heavy-Infantry-heavy and lacks an Archer-family complement. This is the same counter-synergy relationship vanilla uses. Prefer the best actual cultural/special Archer option available to your ruler."
  ddm_manager.3010.plan_gunpowder: "\n\n#P Gunpowder opportunity detected.#!\nVanilla gives gunpowder an unusually high strategic weight because access is constrained. Treat this as a strong candidate when it is genuinely recruitable, but do not disband a functioning core merely to chase the signal."
  ddm_manager.3010.plan_siege: "\n\n#P Consider reserving the next slot for siege.#!\nYour combat roster is established and no siege regiment is present. Siege weapons do not replace battlefield counters, but they can shorten wars enough to justify a dedicated slot once the fighting core is stable."
  # Domain-management workflow
  ddm_manager.1000.desc_v19: "This page contains the settings that govern my next land distribution. I personally hold #V [GetPlayer.GetDomainSize]#! holdings; vanilla permits #V [GetPlayer.GetDomainLimit]#!, but my confirmed protected-domain target is #V [GetPlayer.MakeScope.Var('ddm_protected_domain_target').GetValue|0]#!. The distributor sheds every unprotected holding until that chosen target is reached.\n\n"
  ddm_manager.1000.policy_balanced: "Succession influence: #P Neutral#! — the whole eligible dynasty competes by perceived rightfulness, territorial fit, merit, safety and existing power."
  ddm_manager.1000.policy_follow: "Succession influence: #V Respect Current Heir#! — the whole dynasty still competes, but the current CK3 heir of a title receives a modest legitimacy bonus."
  ddm_manager.1000.policy_estate: "Succession influence: #V Preserve Primary Estate#! — the primary heir is modestly deprioritized because they are expected to inherit the protected personal core."
  ddm_manager.1000.v19_edit: "Edit Personal Domain"
  ddm_manager.1000.v19_edit.flavor: "Open one scrollable checkbox list of every personal holding. Checked means MINE; unchecked means surplus."
  ddm_manager.1000.v19_distribute: "Distribute Surplus"
  ddm_manager.1000.v19_distribute.flavor: "Settle every holding outside the confirmed personal core until I reach my chosen protected-domain target, then organize duchies and kingdoms automatically."
  ddm_manager.1000.v19_preview: "Preview Distribution"
  ddm_manager.1000.v19_preview.flavor: "Show who is projected to receive the surplus and why before transferring anything."
  ddm_manager.1000.v19_policy: "Distribution Rules"
  ddm_manager.1000.v19_policy.flavor: "Change dynastic preference, power concentration, succession influence, alliance policy, family-regard depth, gender-law alignment, and realm-integrity rules without leaving Realm & Titles."
  ddm_manager.1000.v19_more: "More Realm Tools"

  ddm_manager.1010.v19.t: "Proposed Dynastic Distribution"
  ddm_manager.1010.v19.desc: "Surplus to place: #V [GetPlayer.MakeScope.Var('ddm_preview_surplus').GetValue|0]#! holdings. The preview successfully allocated #V [GetPlayer.MakeScope.Var('ddm_preview_allocated').GetValue|0]#! in simulation. Succession-signaled dynasts available for modifier purposes: #V [GetPlayer.MakeScope.Var('ddm_last_partition_heirs_available').GetValue|0]#!.\n\nThe office judges the entire eligible dynasty. Family regard is the primary social-legitimacy signal; claims, de-jure position, current holdings, merit, political safety and prior grants shape each title-specific choice. There is no everyone-gets-one quota.\n\n#N Before distributing: #V [GetPlayer.MakeScope.Var('ddm_warn_top_tier_titles').GetValue|0]#! of my titles sit at my own tier. Granting one of those away can make the recipient independent or hand them a disproportionate share of my levies.#!\n\n#P My religious head title is protected and will never be distributed. Protection active: #V [GetPlayer.MakeScope.Var('ddm_warn_faith_protected').GetValue|0]#!.#!"
  ddm_manager.1010.v19.policy_balanced: "\n#P Succession influence: Neutral.#! Succession does not change the dynasty-wide rightfulness judgment."
  ddm_manager.1010.v19.policy_follow: "\n#V Succession influence: Respect Current Heir.#! A title's current heir receives a modest bonus, not ownership of the recipient pool."
  ddm_manager.1010.v19.policy_estate: "\n#V Succession influence: Preserve Primary Estate.#! The primary heir is modestly penalized before inheriting the protected core."
  ddm_manager.1010.v19.recipient1: "\n\n#V [scope:ddm_preview_recipient_1.GetName]#! — projected #V [GetPlayer.MakeScope.Var('ddm_preview_r1_grants').GetValue|0]#! holdings. Inheritable quality: [GetPlayer.MakeScope.Var('ddm_preview_r1_quality').GetValue|0]; merit/education: [GetPlayer.MakeScope.Var('ddm_preview_r1_merit').GetValue|0]; political safety: [GetPlayer.MakeScope.Var('ddm_preview_r1_loyalty').GetValue|0]; family regard: [GetPlayer.MakeScope.Var('ddm_preview_r1_family').GetValue|0]."
  ddm_manager.1010.v19.recipient2: "\n#V [scope:ddm_preview_recipient_2.GetName]#! — projected #V [GetPlayer.MakeScope.Var('ddm_preview_r2_grants').GetValue|0]#! holdings. Inheritable quality: [GetPlayer.MakeScope.Var('ddm_preview_r2_quality').GetValue|0]; merit/education: [GetPlayer.MakeScope.Var('ddm_preview_r2_merit').GetValue|0]; political safety: [GetPlayer.MakeScope.Var('ddm_preview_r2_loyalty').GetValue|0]; family regard: [GetPlayer.MakeScope.Var('ddm_preview_r2_family').GetValue|0]."
  ddm_manager.1010.v19.recipient3: "\n#V [scope:ddm_preview_recipient_3.GetName]#! — projected #V [GetPlayer.MakeScope.Var('ddm_preview_r3_grants').GetValue|0]#! holdings. Inheritable quality: [GetPlayer.MakeScope.Var('ddm_preview_r3_quality').GetValue|0]; merit/education: [GetPlayer.MakeScope.Var('ddm_preview_r3_merit').GetValue|0]; political safety: [GetPlayer.MakeScope.Var('ddm_preview_r3_loyalty').GetValue|0]; family regard: [GetPlayer.MakeScope.Var('ddm_preview_r3_family').GetValue|0]."
  ddm_manager.1010.v19.shortfall: "\n\n#N Preview warning: not every surplus holding found a recipient in the simulation.#! Review recipient rules before executing."
  ddm_manager.1010.v19.execute: "Approve This Distribution"
  ddm_manager.1010.v19.edit: "Edit Personal Domain"
  ddm_manager.1010.v19.policy: "Distribution Rules"

  ddm_manager.1012.t: "Personal Domain Confirmed"
  ddm_manager.1012.desc: "My personal estate now contains #V [GetPlayer.MakeScope.Var('ddm_protected_domain_target').GetValue|0]#! protected holdings. That—not the vanilla limit of #V [GetPlayer.GetDomainLimit]#!—is where automatic settlement stops. Every other personally held holding is surplus, including new conquests, until I deliberately change the protected estate."
  ddm_manager.1012.a: "Preview the proposed distribution."
  ddm_manager.1012.b: "Distribute the surplus now."

  ddm_manager.1030.t: "Additional Realm Tools"
  ddm_manager.1030.desc: "These are useful but less frequent operations, kept off the main land-management page so the everyday workflow stays short."
  ddm_manager.1030.a: "Organize higher titles."
  ddm_manager.1030.b: "Reclaim eligible non-dynastic titles."
  ddm_manager.1030.c: "Run the full dynastic settlement."

  ddm_manager.0490.v19.t: "Succession Influence on Rightfulness"
  ddm_manager.0490.v19.desc: "Succession never defines who may receive conquered land. The entire eligible dynasty is judged by perceived rightfulness and territorial fit. This setting only changes how much the current inheritance picture modifies that score. Male/Female Only remains a hard legal filter when gender-law alignment is enabled."
  ddm_manager.0490.v19.a: "Succession Neutral — Default"
  ddm_manager.0490.v19.a.flavor: "Ignore succession when placing surplus. Family regard, territorial legitimacy, capability, political safety and existing power decide who is most rightful."
  ddm_manager.0490.v19.b: "Respect Current Heir"
  ddm_manager.0490.v19.b.flavor: "Give the current CK3 heir of the specific title a modest legitimacy bonus. Claims, territory, family regard and safety can still produce another ruler."
  ddm_manager.0490.v19.c: "Preserve Primary Estate"
  ddm_manager.0490.v19.c.flavor: "Modestly deprioritize the primary heir while they are expected to inherit the protected personal estate. Junior heirs receive only a small legitimacy signal; neither group owns the candidate pool."

  ddm_manager.0470.v19.desc: "Succession influence is changed from Realm & Titles, where it is visible beside the Distribute button. It modifies rightfulness but never replaces the dynasty-wide recipient pool. This advanced page keeps alliance and gender-alignment rules."
  ddm_manager.0470.v19.policy: "Open Succession Influence"

  ddm_manager.2010.v19.desc: "The clerks identify #V [GetPlayer.MakeScope.Var('ddm_succession_heir_count').GetValue|0]#! current heirs, including #V [GetPlayer.MakeScope.Var('ddm_partition_secondary_heirs').GetValue|0]#! behind the primary heir. The ledger now bounds-checks each displayed heir and counts expected titles by inspecting my held titles' current_heir directly; it no longer manufactures a duplicate third heir when only two exist.\n\n"
  ddm_manager.2010.v19.policy_balanced: "Land-manager succession influence: #P Neutral#!."
  ddm_manager.2010.v19.policy_follow: "Land-manager succession influence: #V Respect Current Heir#!."
  ddm_manager.2010.v19.policy_estate: "Land-manager succession influence: #V Preserve Primary Estate#!."

  ddm_manager.0110.t: "The Dynastic Compact"
  ddm_manager.0110.desc: "A day has passed since the settlement. The office has now performed one consolidated alliance refresh under the standing policy and created #V [GetPlayer.MakeScope.Var('ddm_last_alliances_created').GetValue|0]#! missing dynastic alliances. Land distribution itself no longer pauses to create alliances recipient by recipient."
  ddm_manager.0110.a: "Record the compact and return to Realm & Titles."

  ddm_manager.1050.t: "Distribution Rules"
  ddm_manager.1050.desc: "These are the rules that directly shape who receives conquered land. They now live beside Distribute Surplus instead of being buried in the general administration menus. Click a rule to cycle its setting.\n"
  ddm_manager.1050.family: "Cycle Dynastic Preference"
  ddm_manager.1050.power: "Cycle Power-Concentration Policy"
  ddm_manager.1050.succession: "Cycle Succession Influence"
  ddm_manager.1050.alliance: "Cycle Post-Settlement Alliance Policy"
  ddm_manager.1050.advanced: "Eligibility & Perception Rules"

  ddm_manager.1051.t: "Eligibility & Perception Rules"
  ddm_manager.1051.desc: "These secondary distribution rules determine whose opinions count, how succession gender law affects eligibility, and whether foreign-heir leakage is penalized. Click a rule to toggle or cycle it.\n"
  ddm_manager.1051.regard: "Cycle Family-Regard Depth"
  ddm_manager.1051.gender: "Toggle Gender-Law Alignment"
  ddm_manager.1051.integrity: "Toggle Realm-Integrity Protection"

  # Personal Domain Planner scripted GUI
  DDM_DOMAIN_PLANNER_TITLE: "Personal Domain Planner"
  DDM_DOMAIN_PLANNER_CANCEL: "Cancel"
  DDM_DOMAIN_PLANNER_DESC: "The holdings marked here form the Crown Estate. They remain in my hand when the Domain Office settles newly acquired lands. My capital is always reserved."
  DDM_DOMAIN_PLANNER_COUNT: "Selected: [GetPlayer.MakeScope.Var('ddm_planner_selected_count').GetValue|0] / [GetPlayer.MakeScope.Var('ddm_planner_target_count').GetValue|0]    Personal holdings found: [GetPlayer.MakeScope.Var('ddm_planner_total_count').GetValue|0]"
  DDM_DOMAIN_PLANNER_HINT: "The office will continue granting surplus until only the reserved estate remains."
  DDM_DOMAIN_PLANNER_RECOMMEND: "Use Office Recommendation"
  DDM_DOMAIN_PLANNER_RECOMMEND_TT: "Select the strongest personal holdings by capital status, development, stationed Men-at-Arms, special buildings and military infrastructure. I can change any checkbox afterward."
  DDM_DOMAIN_PLANNER_MAA: "Protect Stationed MAA"
  DDM_DOMAIN_PLANNER_MAA_TT: "Add every personally held holding with a stationed Men-at-Arms regiment to the selected core. If this exceeds the domain limit, uncheck the least important selection before confirming."
  DDM_DOMAIN_PLANNER_CAPITAL_DUCHY: "Protect Capital Duchy"
  DDM_DOMAIN_PLANNER_CAPITAL_DUCHY_TT: "Add personally held counties in the capital duchy to the selected core."
  DDM_DOMAIN_PLANNER_CLEAR: "Clear Except Capital"
  DDM_DOMAIN_PLANNER_CLEAR_TT: "Uncheck every holding except the mandatory capital."
  DDM_DOMAIN_PLANNER_CONFIRM: "Record the Crown Estate"
  DDM_DOMAIN_PLANNER_CONFIRM_TT: "Fix these holdings as my personal estate. Every other personally held county or secondary barony may be entrusted to another ruler when the realm is settled."
  DDM_DOMAIN_PLANNER_CONFIRM_HELP: "These orders endure between wars. Newly conquered holdings begin outside the Crown Estate unless I return here and reserve them."
  DDM_DOMAIN_TAG_RECOMMENDED: "Recommended"
  DDM_DOMAIN_TAG_MAA: "MAA"
  DDM_DOMAIN_TAG_SPECIAL: "Special"
  DDM_DOMAIN_TAG_CAPITAL_DUCHY: "Capital Duchy"

