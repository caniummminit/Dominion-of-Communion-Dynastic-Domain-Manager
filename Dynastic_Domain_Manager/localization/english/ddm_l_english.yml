  DDM_UI_PAGE_RECORDS: "Ledger"
  DDM_UI_SIDEBAR_NOTE: "The office remembers its orders. Change a rule only when the realm itself should change."

  DDM_UI_OVERVIEW_TITLE: "State of the Realm"
  DDM_UI_OVERVIEW_FLAVOR: "Before the seals are set and the charters dispatched, the clerks lay the realm before me: what belongs to the Crown, what awaits a ruler, and how widely my house has been planted."
  DDM_UI_OVERVIEW_CROWN: "The Crown Estate"
  DDM_UI_OVERVIEW_CROWN_STATS: "Personal domain: #V [GetPlayer.MakeScope.Var('ddm_dash_personal_domain').GetValue|0]#! / #V [GetPlayer.MakeScope.Var('ddm_dash_domain_limit').GetValue|0]#! legal limit    Crown Estate target: #V [GetPlayer.MakeScope.Var('ddm_protected_domain_target').GetValue|0]#!\nDistributable counties: #V [GetPlayer.MakeScope.Var('ddm_dash_distributable_counties').GetValue|0]#!    Secondary baronies: #V [GetPlayer.MakeScope.Var('ddm_dash_distributable_baronies').GetValue|0]#!"
  DDM_UI_OVERVIEW_REALM: "The High Titles"
  DDM_UI_OVERVIEW_REALM_STATS: "Duchies in my hand: #V [GetPlayer.MakeScope.Var('ddm_dash_held_duchies').GetValue|0]#!    Kingdoms in my hand: #V [GetPlayer.MakeScope.Var('ddm_dash_held_kingdoms').GetValue|0]#!\nDirect vassals: #V [GetPlayer.MakeScope.Var('ddm_dash_vassal_count').GetValue|0]#! / #V [GetPlayer.MakeScope.Var('ddm_dash_vassal_limit').GetValue|0]#! limit    Managed top-rank estate: #V [GetPlayer.MakeScope.Var('ddm_dash_managed_top_rank').GetValue|0]#!"
  DDM_UI_OVERVIEW_DYNASTY: "The Dynasty"
  DDM_UI_OVERVIEW_DYNASTY_STATS: "Living dynasts: #V [GetPlayer.MakeScope.Var('ddm_dash_living_dynasty').GetValue|0]#!    Landed dynasts: #V [GetPlayer.MakeScope.Var('ddm_dash_landed_dynasty').GetValue|0]#!\nLanded rulers outside the dynasty: #V [GetPlayer.MakeScope.Var('ddm_dash_non_dynasty_rulers').GetValue|0]#!"
  DDM_UI_SETTLE: "Settle the Realm"
  DDM_UI_SETTLE_TT: "Distribute every unreserved personal holding down to the Crown Estate target, then organize duchies and kingdoms according to the standing hierarchy and recipient rules."
  DDM_UI_SETTLE_AFTER_WAR: "Settle After the War"
  DDM_UI_SETTLE_AFTER_WAR_TT: "Record a standing settlement order. The office will wait until the realm is at peace, then either execute automatically or reopen the Crown Estate if the personal-domain plan needs confirmation."
  DDM_UI_SETTLEMENT_QUEUED: "Settlement Queued"
  DDM_UI_SETTLEMENT_QUEUED_TT: "The office is waiting for the current war to end before carrying out the standing settlement order."
  DDM_UI_PREVIEW: "Read the Proposed Grants"
  DDM_UI_PREVIEW_TT: "Prepare a non-destructive projection using the same recipient pool and rightfulness scoring as the live settlement."
  DDM_UI_OUTSIDER_INVARIANT: "#P Outsider grants are respected by default.#! The Outsider Holdings page may protect individual counties permanently or authorize reclamation of the rest."

  DDM_UI_ESTATE_TITLE: "The Crown Estate"
  DDM_UI_ESTATE_FLAVOR: "These are the lands I reserve to my own hand. The Domain Office may entrust every other personal holding to a suitable ruler, but it will not cross the boundary I draw here."
  DDM_UI_ESTATE_COUNT: "Reserved: #V [GetPlayer.MakeScope.Var('ddm_planner_selected_count').GetValue|0]#! of #V [GetPlayer.MakeScope.Var('ddm_planner_target_count').GetValue|0]#! permitted holdings    •    Personal holdings found: #V [GetPlayer.MakeScope.Var('ddm_planner_total_count').GetValue|0]#!"
  DDM_UI_ESTATE_RECOMMEND: "Steward's Choice"
  DDM_UI_ESTATE_MAA: "Army Seats"
  DDM_UI_ESTATE_CAPITAL: "Capital Duchy"
  DDM_UI_ESTATE_CLEAR: "Clear"
  DDM_UI_ESTATE_CANCEL: "Discard Changes"
  DDM_UI_ESTATE_SAVE: "Record the Crown Estate"
  DDM_UI_ESTATE_SAVE_TT: "Save these holdings as the permanent stopping point for settlement. If settlement sent me here, the clerks will resume their work immediately afterward."
  DDM_UI_SORT_LABEL: "Order:"
  DDM_UI_SORT_HIERARCHY: "De Jure A-Z"
  DDM_UI_SORT_HIERARCHY_TT: "Group holdings through their live de-jure Empire, Kingdom, and Duchy, then order the underlying vanilla county titles alphabetically. Reverse flips the complete hierarchy. Dynamically renamed/custom titles retain their underlying title identity for stable sorting."
  DDM_UI_SORT_DEVELOPMENT: "Development"
  DDM_UI_SORT_FAITH: "Faith"
  DDM_UI_SORT_CULTURE: "Culture"
  DDM_UI_SORT_REVERSE: "Reverse"
  DDM_UI_SORT_REVERSE_TT: "Reverse the current holding order. De Jure A-Z reverses the complete grouped hierarchy; Development is numeric; Faith and Culture group matching counties first and use development within the group."

  DDM_UI_DISTRIBUTION_TITLE: "Law of Distribution"
  DDM_UI_DISTRIBUTION_FLAVOR: "A grant is not a lottery and it is not an inheritance rehearsal. For each unsettled title, the office asks which eligible ruler can most plausibly hold it: by standing, territory, claims, ability, loyalty, safety and the balance of the realm."
  DDM_UI_DISTRIBUTION_DYNASTIC_PREF: "Whose Branch Carries Preference"
  DDM_UI_FAMILY_HOUSE_ONLY: "#V House First#! — the whole dynasty remains eligible, but members of my own House receive the strongest preference."
  DDM_UI_FAMILY_HOUSE_PREFERRED: "#P House Preferred#! — the whole dynasty is eligible, with a moderate preference for my own House."
  DDM_UI_FAMILY_DYNASTY_EQUAL: "#V Dynasty Equal#! — every House of the dynasty begins on equal footing."
  DDM_UI_FAMILY_SET_1: "House First"
  DDM_UI_FAMILY_SET_3: "Prefer My House"
  DDM_UI_FAMILY_SET_2: "Whole Dynasty"
  DDM_UI_POWER_TITLE: "Concentration of Power"
  DDM_UI_POWER_1: "#P Restrained#! — strongly favors smaller and landless rulers."
  DDM_UI_POWER_2: "#V Balanced#! — existing strength matters, but territorial right can outweigh it."
  DDM_UI_POWER_3: "#N Permissive#! — powerful rulers may grow further when their territorial case is strongest."
  DDM_UI_POWER_SET_1: "Restrained"
  DDM_UI_POWER_SET_2: "Balanced"
  DDM_UI_POWER_SET_3: "Permissive"
  DDM_UI_PERCEPTION_TITLE: "Perception & Eligibility"
  DDM_UI_REGARD_CLOSE: "Close-Family Regard"
  DDM_UI_REGARD_DYNASTY: "Dynasty-Wide Regard"
  DDM_UI_GENDER_TOGGLE: "Gender-Law Alignment"
  DDM_UI_INTEGRITY_TOGGLE: "Realm-Integrity Protection"
  DDM_UI_REGARD_CURRENT_CLOSE: "Family regard: #V close and extended family#! are consulted."
  DDM_UI_REGARD_CURRENT_DYNASTY: "Family regard: #V the living dynasty#! is consulted."
  DDM_UI_GENDER_ON: "Gender law: #P aligned#! with the realm's active succession law."
  DDM_UI_GENDER_OFF: "Gender law: #V ignored#! for automatic-grant eligibility."
  DDM_UI_INTEGRITY_ON: "Realm integrity: #P guarded#! against obvious foreign-heir leakage."
  DDM_UI_INTEGRITY_OFF: "Realm integrity: #V not considered#! in recipient scoring."
  DDM_UI_DISTRIBUTION_RULES_TITLE: "How Settlement Chooses Rulers"
  DDM_UI_DISTRIBUTION_RULES: "#V 1.#! The Crown Estate is never crossed.  #V 2.#! Direct title reservations are honored first when legal; selected non-dynastic priorities then receive first-pass priority for one legal county grant while land remains.  #V 3.#! Every title is then scored separately: claims, de-jure position and existing local control are strongest; capability, loyalty and social regard follow.  #V 4.#! Existing domain size, excessive military concentration and grants already received in this settlement reduce the score.  #V 5.#! Duchies and kingdoms favor rulers who already control their de-jure land. Succession changes the score; it does not dictate the result."
  DDM_UI_EXISTING_GRANTS: "#P Protected outsider counties are never reclaimed.#! Unprotected outsider estates are touched only when the Outsider Holdings policy explicitly permits it."

  DDM_UI_HIERARCHY_TITLE: "The Realm's Hierarchy"
  DDM_UI_HIERARCHY_FLAVOR: "Counties make the body of the realm; duchies and kingdoms give it shape. The office raises local rulers where the territorial case is strongest while preserving the Crown's proper share of the rank immediately beneath mine."
  DDM_UI_HIERARCHY_HELD: "In my hand now: #V [GetPlayer.MakeScope.Var('ddm_dash_held_duchies').GetValue|0]#! duchies and #V [GetPlayer.MakeScope.Var('ddm_dash_held_kingdoms').GetValue|0]#! kingdoms."
  DDM_UI_HIERARCHY_CROWN_RULE: "When I am an #V Emperor#!, the Crown retains roughly #V 40%#! of the managed kingdoms; when I am a #V King#!, it retains roughly #V 40%#! of the managed duchies. The strongest titles by military strength per county are reserved first.\n\nManaged estate: #V [GetPlayer.MakeScope.Var('ddm_dash_managed_top_rank').GetValue|0]#!    Intended Crown share: #V [GetPlayer.MakeScope.Var('ddm_dash_top_rank_target').GetValue|0]#!"
  DDM_UI_HIERARCHY_VASSAL_LIMIT: "#BOLD Direct-vassal administration#!\nDirect vassals: #V [GetPlayer.MakeScope.Var('ddm_dash_vassal_count').GetValue|0]#! / #V [GetPlayer.MakeScope.Var('ddm_dash_vassal_limit').GetValue|0]#! limit    Over limit: #V [GetPlayer.MakeScope.Var('ddm_dash_vassal_overage').GetValue|0]#!\n#weak This is separate from the personal Domain Limit. Moving a vassal beneath a proper liege changes reporting lines; it does not change who owns the land.#!"
  DDM_UI_HIERARCHY_PROPER_LAST: "Last proper-liege pass: #V [GetPlayer.MakeScope.Var('ddm_last_proper_liege_transfers').GetValue|0]#! direct vassals transferred."
  DDM_UI_HIERARCHY_LAST: "Last hierarchy pass: #V [GetPlayer.MakeScope.Var('ddm_last_duchies_granted').GetValue|0]#! duchies granted, #V [GetPlayer.MakeScope.Var('ddm_last_kingdoms_granted').GetValue|0]#! kingdoms granted, #V [GetPlayer.MakeScope.Var('ddm_last_top_rank_retained').GetValue|0]#! top-rank titles retained."
  DDM_UI_HIERARCHY_RUN: "Order the High Titles"
  DDM_UI_HIERARCHY_RUN_TT: "Re-run only the duchy/kingdom hierarchy pass. County holders are left where they are."
  DDM_UI_HIERARCHY_PROPER_LIEGES: "Distribute to Proper Lieges"
  DDM_UI_HIERARCHY_PROPER_LIEGES_TT: "Reduce direct-vassal clutter without changing title ownership. The office checks each direct count, duke, and king against the live de-jure hierarchy and transfers that ruler beneath the nearest legal de-jure liege already serving directly under me. It skips wars, full vassal limits, special administrative family titles, incompatible government transfers, and any case where I personally am already the proper liege."

  DDM_UI_DYNASTY_TITLE: "The Recipient Pool"
  DDM_UI_DYNASTY_FLAVOR: "The dynasty remains the ordinary governing class, but the Crown may deliberately admit non-dynastic courtiers awaiting their first grant and established vassals already in the realm. I choose the eligible field here; the allocator still decides which title each candidate has the strongest claim to hold unless I reserve a specific title."
  DDM_UI_DYNASTY_STATS: "Living dynasts: #V [GetPlayer.MakeScope.Var('ddm_dash_living_dynasty').GetValue|0]#!    Landed dynasts: #V [GetPlayer.MakeScope.Var('ddm_dash_landed_dynasty').GetValue|0]#!\nEligible non-dynastic candidates listed: #V [GetPlayer.MakeScope.Var('ddm_outsider_recipient_total').GetValue|0]#!"
  DDM_UI_DYNASTY_OUTSIDERS: "There are #V [GetPlayer.MakeScope.Var('ddm_dash_non_dynasty_rulers').GetValue|0]#! landed rulers outside the dynasty beneath me. Their counties may be individually protected under #V Outsider Holdings#!; all others can remain respected or be reclaimed under the standing policy."
  DDM_UI_DYNASTY_REVIEW_NOTE: "Dynastic standards and the destructive review system remain available as a specialist office while that subsystem is migrated into this window."
  DDM_UI_RECIPIENT_SCOPE_TITLE: "Who May Receive New Grants"
  DDM_UI_RECIPIENT_SCOPE_DYNASTY_CURRENT: "Current field: #P Dynasty Only#!. Non-dynastic courtiers and vassals are not considered for ordinary new grants; direct title reservations remain explicit exceptions."
  DDM_UI_RECIPIENT_SCOPE_SELECTED_CURRENT: "Current field: #V Selected Candidates#!. Only checked non-dynastic courtiers or vassals join the dynastic pool."
  DDM_UI_RECIPIENT_SCOPE_ALL_CURRENT: "Current field: #N All Eligible Candidates#!. Every legal non-dynastic courtier or vassal may compete; checked candidates receive first-pass priority for one legal grant."
  DDM_UI_RECIPIENT_SCOPE_DYNASTY: "Dynasty Only"
  DDM_UI_RECIPIENT_SCOPE_SELECTED: "Selected Candidates"
  DDM_UI_RECIPIENT_SCOPE_ALL: "All Eligible"
  DDM_UI_RECIPIENT_PRIORITY_NOTE: "Check a non-dynastic candidate to give that person first-pass priority for #V one legal county grant#!. This does not hard-assign a county: ordinary scoring still chooses the best territorial fit. #V Right-click a candidate and use Reserve a Title#! when I want a specific county, duchy, or kingdom bound to that person."
  DDM_UI_RECIPIENT_PRIORITY_TT: "Priority candidate. In Selected Candidates mode, only checked non-dynastic candidates enter ordinary allocation. In All Eligible mode, everyone listed may compete, but checked candidates are strongly prioritized until their first legal county grant of the settlement. Direct title reservations are processed first."
  DDM_UI_RECIPIENT_REFRESH: "Refresh Candidates"
  DDM_UI_DYNASTY_REVIEW: "Open Dynastic Review"
  DDM_UI_DYNASTY_RECLAIM: "Manage Outsider Holdings"
  DDM_UI_DYNASTY_RECLAIM_TT: "Choose which outsider-held counties are protected, decide whether ordinary settlement may reclaim the rest, or issue a reclamation immediately."

  DDM_UI_OUTSIDERS_TITLE: "Outsider Holdings"
  DDM_UI_OUTSIDERS_FLAVOR: "Not every worthy servant bears my blood. A checked county is a grant the Crown has chosen to honor; an unchecked county remains beyond the dynasty only so long as the standing policy permits it."
  DDM_UI_OUTSIDERS_STATS: "Outsider counties recorded: #V [GetPlayer.MakeScope.Var('ddm_outsider_county_total').GetValue|0]#!    Protected: #P [GetPlayer.MakeScope.Var('ddm_outsider_county_protected').GetValue|0]#!    Unprotected: #N [GetPlayer.MakeScope.Var('ddm_outsider_county_reclaimable').GetValue|0]#!"
