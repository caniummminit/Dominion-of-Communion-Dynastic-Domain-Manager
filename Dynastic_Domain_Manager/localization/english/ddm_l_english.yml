  DDM_UI_TITLE: "Dynastic Domain Office"
  DDM_UI_SUBTITLE: "The realm is not merely inherited. It is ordered."
  DDM_UI_CLOSE: "Close"
  DDM_UI_PAGE_OVERVIEW: "Overview"
  DDM_UI_PAGE_ESTATE: "Crown Estate"
  DDM_UI_PAGE_DISTRIBUTION: "Distribution"
