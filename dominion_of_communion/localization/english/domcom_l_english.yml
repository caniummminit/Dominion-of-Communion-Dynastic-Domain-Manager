  DOMCOM_UI_TANTALIZED_FLAVOR: "Alpha is rivalry; this is appetite. Everyone here has been drawn toward me at least once, whatever their sex, and each carries an Obedience score that rises with every successful Tantalize. Obedience is a separate track from Cuck Experience: it is not humiliation but attachment, and at 1000 it stops being attachment at all."
