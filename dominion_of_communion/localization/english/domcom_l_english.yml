  DOMCOM_UI_SORT_TOTAL: "Total"
  DOMCOM_UI_SORT_TOTAL_TT: "Sort by the plain sum of all six skills."
  DOMCOM_UI_SORT_PRIZE: "Prize"
  DOMCOM_UI_SORT_PRIZE_TT: "Sort by overall worth: skills, congenital quality, and personality. Prowess counts half, since it sits on a different scale to the council skills. Deep Cuck Experience adds a little."

  DOMCOM_UI_REPAIR_COLLAPSES: "Repair Collapses"
  DOMCOM_UI_REPAIR_COLLAPSES_TT: "Reopen subjects whose Final Collapse was recorded as resolved while they kept their titles. Repairs legacy terminal state so Collapse can be attempted again."

 domcom_invite_to_bed_interaction_desc: "Send for them. What is already understood between us need not stay understood."
 domcom_invite_to_bed_tt: "#weak Choose how openly to do it. The bolder the hour, the more it costs them in standing, and the likelier the household is to see.#!"

 domcom.800.t: "The Appointed Hour"
 domcom.800.desc: "They came when I sent for them. The question is not whether. The question is how much of the household is meant to understand what is happening under its own roof."
 domcom.800.a: "Discreetly. Let it be ours alone."
 domcom.800.a.tt: "#weak 10% exposure risk. If nobody discovers you, discretion sharpens your Intrigue and command while adding a little Dread.#!"
 domcom.800.b: "Openly enough that the servants talk."
 domcom.800.b.tt: "#weak 35% exposure risk. Success is more intimidating; discovery can trigger a direct confrontation with their spouse.#!"
 domcom.800.c: "In their own hall, and let them draw their own conclusions."
 domcom.800.c.tt: "#weak 65% exposure risk. The boldest reward if you get away with it, but the harshest imprisonment risk if their spouse corners you.#!"
 domcom.800.d: "Not tonight."


