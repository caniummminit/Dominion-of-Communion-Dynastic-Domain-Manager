  domcom_extreme_marital_aversion_modifier: "Deep Marital Aversion"
  domcom_extreme_marital_aversion_modifier_desc: "This character's private attraction profile is profoundly incompatible with their spouse. The marriage itself has become a source of stress and, for sufficiently ruthless personalities, potentially murderous resentment."
  domcom_extreme_marital_fixation_modifier: "Marital Fixation"
  domcom_extreme_marital_fixation_modifier_desc: "This character's private attraction profile aligns extraordinarily well with their spouse. The fixation is intense, but desire is still not the same thing as Obedience."

 domcom_world_seed: "Dominion: Existing Save Seeding"
 domcom_world_seed_desc: "Controls whether Dominion measures the whole living population once when a save is first loaded with the mod active."
 setting_domcom_world_seed_on: "On"
 setting_domcom_world_seed_on_desc: "Recommended. Measures every adult man once, then never again for that save. Required for Dominion to work properly on a save that did not start with the mod. Costs a brief pause on the first load."
 setting_domcom_world_seed_off: "Off"
 setting_domcom_world_seed_off_desc: "Characters are measured only when they turn 18, join your court, gain a title, or enter a Dominion roster. No startup cost, but most characters on an existing save will show no Endowment."

 domcom_tantalize_tt_header: "Chance of success: #V [scope:recipient.MakeScope.ScriptValue('domcom_tantalize_chance_v063_value')|0]%#!"
 domcom_tantalize_tt_success: "#weak Success:#! they are drawn further into your influence and gain Obedience. A successful Tantalize can also turn intimate, with a lower pregnancy opportunity than Invite to Bed."
 domcom_tantalize_tt_failure: "#weak Failure:#! they resist your influence and lose #N 30#! Opinion of you for #V 2#! years."

 domcom_debug_tools: "Dominion: Rebuild Tools"
 domcom_debug_tools_desc: "Adds two decisions for re-applying Dominion to a save that already ran an earlier version. Intended for testing."
 setting_domcom_debug_tools_off: "Off"
 setting_domcom_debug_tools_off_desc: "The rebuild decisions are hidden."
 setting_domcom_debug_tools_on: "On"
 setting_domcom_debug_tools_on_desc: "Adds Rebuild Endowment Display and Reroll All Endowments to your decisions list."

 domcom_rebuild_display_decision: "Rebuild Endowment Display"
 domcom_rebuild_display_decision_desc: "Clear every derived Endowment value and recompute it from the measurements already recorded. Sizes do not change. Use this after altering tier thresholds, trait display, icons or Carnalitas mapping."
 domcom_rebuild_display_decision_tooltip: "Rebuild Endowment Display"
 domcom_rebuild_display_decision_confirm: "Rebuild"

 domcom_rebuild_measurements_decision: "Reroll All Endowments"
 domcom_rebuild_measurements_decision_desc: "#N Destructive.#! Discard every recorded length and girth and roll them again from scratch. Every character's size will change. Use this after altering the roll weights or the Carnalitas seeding map."
 domcom_rebuild_measurements_decision_tooltip: "Reroll All Endowments"
 domcom_rebuild_measurements_decision_confirm: "Reroll Everything"

 domcom_ledger_age_gate_tt: "The Communion opens to you at #V 18#!. Its records are kept, and they will be waiting."

 domcom_alpha_check_tt_header: "Chance of success: #V [scope:recipient.MakeScope.ScriptValue('domcom_alpha_check_chance_value')|0]%#!"
 domcom_alpha_check_tt_success: "#weak Success:#! you outclass the rival. Before cuck evidence this establishes leverage; after cuck evidence it reinforces Dominion and increases Cuck XP."
 domcom_alpha_check_tt_failure: "#weak Failure:#! they resist the challenge and lose #N 100#! Opinion of you for #V 3#! years."

