  DOMCOM_UI_EXTRACT_SECRETS: "Extract Secrets"
  DOMCOM_UI_EXTRACT_SECRETS_TT: "Reveal every currently reachable secret in this Owned subject's Dominion intelligence network. #bold This reveals secrets; it does not create hooks automatically.#! Use Blackmail on the characters whose secrets you learn to turn eligible leverage into hooks under CK3's normal rules."
  DOMCOM_UI_DEMAND_TRIBUTE_NOW: "Demand Tribute Now"
  DOMCOM_UI_DEMAND_TRIBUTE_NOW_TT: "Demand one year of tribute immediately at the subject's current 22% rate (30% under Household Dominion). Their own treasury pays first. Any shortfall is seized from wealthy adult vassals, courtiers, and close family, who will severely resent the subject for making them pay. Monthly tribute is then considered prepaid for one year."
  DOMCOM_UI_TRIBUTE_ADVANCE_TOAST: "A Year's Tribute Has Been Extracted"
  DOMCOM_UI_ALPHA_GAUNTLET: "Run Alpha Gauntlet"
  DOMCOM_UI_ALPHA_GAUNTLET_TT: "Requires at least four eligible Cucked rivals. Challenges begin with the hardest target. The first check is 10% harder than a normal Alpha Check, and every success makes the remaining run another 3% harder. Each target receives the same one-year Alpha cooldown as a manual challenge. The first failure ends the Gauntlet; a perfect clear grants Dominion Unchallenged for five years."
  DOMCOM_UI_GAUNTLET_PERFECT_TOAST: "Dominion Unchallenged"
  DOMCOM_UI_GAUNTLET_FAILED_TOAST: "The Alpha Gauntlet Has Broken"
  domcom_dominion_unchallenged_modifier: "Dominion Unchallenged"
  domcom_dominion_unchallenged_modifier_desc: "Every eligible challenge in the Alpha Gauntlet yielded without a single failure. For five years this gives +100 Attraction Opinion, +5 Diplomacy, +5 Intrigue, +15% monthly Prestige, +35 initial personal-scheme success chance, +10 success growth per phase, and +20% speed to Seduce, Romance, Elope, Befriend, and Sway."
  domcom_forced_to_cover_tribute_opinion: "Forced to Pay My Tribute"
  domcom_final_submission_modifier: "Final Submission"
  domcom_final_submission_modifier_desc: "This character has reached a terminal Dominion state. Final Collapse has already been resolved and will never fire again for them."
  domcom_absolute_devotion_modifier: "Absolute Devotion"
  domcom_absolute_devotion_modifier_desc: "The Patron is already part of this character’s intimate household. At the terminal threshold, submission becomes permanent devotion rather than repeated destruction."
  domcom_household_final_modifier: "Household Yielded"
  domcom_household_final_modifier_desc: "Both spouses reached terminal submission under the same Patron and their Household Dominion was resolved as one household."
  domcom_dominated_modifier: "Outclassed"
  domcom_dominated_modifier_desc: "This character lost a pre-cuck Alpha Check. The victor has established leverage and access around their household, but this is not obedience, Cucked status, or full Dominion."
  domcom_reverse_alpha_victory_modifier: "Reverse Alpha"
  domcom_reverse_alpha_victory_modifier_desc: "Defeating someone above my station has become a reputation of its own. For ten years personal schemes gain +10 initial success chance and Seduce, Romance, Elope, Befriend, and Sway progress 10% faster."
  domcom_reverse_alpha_major_upset_modifier: "Reverse Alpha — Great Upset"
  domcom_reverse_alpha_major_upset_modifier_desc: "I overturned a much greater difference in standing. This stacks with Reverse Alpha for another +10 initial personal-scheme success chance and +5 success growth per phase."
  domcom_reverse_alpha_legendary_upset_modifier: "Reverse Alpha — Legendary Upset"
  domcom_reverse_alpha_legendary_upset_modifier_desc: "I overturned an extraordinary gulf in social standing. This stacks with the other Reverse Alpha bonuses, adds +15 initial personal-scheme success chance, +5 success growth per phase, shortens personal-scheme phases, and grants +25 Attraction Opinion."
  domcom_endowment_modest_modifier: "Modest Endowment"
  domcom_endowment_modest_modifier_desc: "This man’s randomly generated endowment falls in the modest tier. Exact measurements are persistent hidden data used only where sexual attraction is mechanically relevant."
  domcom_endowment_average_modifier: "Average Endowment"
  domcom_endowment_average_modifier_desc: "This man’s randomly generated endowment falls in the average tier."
  domcom_endowment_noteworthy_modifier: "Noteworthy Endowment"
  domcom_endowment_noteworthy_modifier_desc: "This man’s randomly generated endowment is noteworthy. Size is not universally preferred; compatibility depends on the other character’s hidden preference."
  domcom_endowment_enviable_modifier: "Enviable Endowment"
  domcom_endowment_enviable_modifier_desc: "This man’s randomly generated endowment is unusually large and may strongly affect attraction or Tantalize for characters whose preferences match it."
  domcom_endowment_legendary_modifier: "Legendary Endowment"
  domcom_endowment_legendary_modifier_desc: "An extreme statistical outlier. This can be a major advantage only for characters whose private preference actually favors it."
  domcom_dominated_by_opinion: "Outclassed Me"
  domcom_final_devotion_opinion: "Absolute Devotion"
  domcom_reverse_alpha_shock_opinion: "Overturned the Hierarchy"
  domcom.101.t: "Absolute Devotion"
  domcom.101.desc: "[domcom_collapsing_subject.GetShortUIName] has passed beyond ordinary resistance. Because [domcom_collapsing_subject.GetSheHe] already stands within my own intimate household, there is nothing left to destroy or seize merely for spectacle.\n\nThe final state is devotion: permanent, settled, and never repeated."
  domcom.101.a: "Then let it be settled."
  domcom.105.t: "The Household Yields"
  domcom.105.desc: "Both [domcom_collapsing_subject.GetShortUIName] and [domcom_collapsing_spouse.GetShortUIName] have reached the end of resistance under the same Dominion.\n\nTheir household no longer needs two separate collapses. It yields as one."
  domcom.105.a: "The household is mine to command."

  DOMCOM_UI_050_NOTE: "#V Alpha/Tantalize split:#! Alpha Checks are same-sex rival dominance contests; Tantalize handles sexual attraction and Obedience. Endowment preferences now affect sexual influence rather than Alpha dominance. Pre-cuck Alpha victory creates access without obedience; post-cuck victory reinforces Cuck Experience."
  DOMCOM_UI_SORT_ENDOW: "Endow."
  DOMCOM_UI_SORT_ENDOW_TT: "Sort by the persistent male Endowment Index. Characters without a male Endowment profile sort at zero."

  domcom_accepts_communion_modifier: "Bound to the Communion"
  domcom_accepts_communion_modifier_desc: "Dominion has settled the question of exclusivity. The Patron may maintain other lovers, soulmates, spouses, concubines, and romances without this character treating those relationships as a betrayal. Established Dominion lover bonds are periodically reasserted if generic relationship events disturb them."
  domcom_communion_acceptance_opinion: "Accepts My Communion"
  DOMCOM_UI_ENFORCE_DOMINION: "Enforce Dominion"
  DOMCOM_UI_ENFORCE_DOMINION_TT: "Repair and reassert my Communion state immediately. This refreshes Owned-subject tolerance, backfills Dominion-established Lovers/Soulmates, restores a registered Dominion intimate if a generic relationship event removed the bond, and reapplies protection against the generic Unfaithful confrontation. It does not turn an untouched prospect into a Lover."
  DOMCOM_UI_ENFORCE_DOMINION_INLINE: "Communion enforcement is automatic. Use this button to repair a Dominion Lover/Soulmate or immediately reassert the state in an existing save, even before anyone becomes Owned."
  DOMCOM_UI_ENFORCE_DOMINION_TOAST: "Dominion Has Been Reasserted"


  nick_domcom_the_cucked: "the Cucked"
  domcom_spawn_of_cuck_modifier: "Spawn of a Cuck"
  domcom_spawn_of_cuck_modifier_desc: "The stain of a parent's public cuckoldry follows their actual biological issue. This modifier applies only when the Cucked character is truly a biological parent and gives -2 Diplomacy, Martial, Stewardship, Intrigue, Learning, and Prowess."
  domcom_cuck_duel_defeat_modifier: "Beaten After the Taunt"
  domcom_cuck_duel_defeat_modifier_desc: "After being taunted over their cuckoldry, this character accepted the challenge and lost before honor could be restored."
  domcom_cuck_duel_refusal_modifier: "Would Not Defend Their Honor"
  domcom_cuck_duel_refusal_modifier_desc: "This character swallowed a public taunt rather than challenge the person who cuckolded them."
  domcom_cuck_duel_honor_modifier: "Honor Defended"
  domcom_cuck_duel_honor_modifier_desc: "Cuckolded or not, this character answered the taunt and defeated the challenger."

  domcom_taunt_cuck_interaction: "Taunt the Cuck"
  domcom_taunt_cuck_interaction_desc: "Mock this character over the affair that made them Cucked. They may back down publicly or challenge me to defend their honor. Winning the confrontation drives their Cuck Experience sharply upward; losing lets them recover some standing."

  domcom.600.t: "Defend Your Honor, Then"
  domcom.600.desc: "[domcom_taunt_patron.GetShortUIName|U] does not bother disguising the insult.\n\nWhat happened within my household is thrown back at me as a public joke, and every word invites the same answer: either I bear it, or I make [domcom_taunt_patron.GetHerHim] answer for it."
  domcom.600.a: "Then face me."
  domcom.600.b: "I will not give this spectacle more life."
  domcom.601.t: "The Taunt Made Flesh"
  domcom.601.desc: "The challenge ends exactly as the insult began: on my terms.\n\nMy Cucked rival tried to answer humiliation with force and failed. What might once have remained private is now harder still to deny."
  domcom.601.a: "That should settle the matter."
  domcom.602.t: "A Costly Taunt"
  domcom.602.desc: "Mockery is easy until the mocked person answers it successfully.\n\nMy Cucked rival met the challenge and won. Their household humiliation remains, but today they recovered a measure of honor at my expense."
  domcom.602.a: "Enjoy the moment."
  domcom.603.t: "No Answer"
  domcom.603.desc: "The insult was heard, understood, and left unanswered.\n\nRather than risk defending their honor, my Cucked rival accepted the laughter and walked away from the challenge."
  domcom.603.a: "Everyone saw enough."

  DOMCOM_UI_053_NOTE: "Every recognized Cuck receives the moniker #N the Cucked#!. Their actual biological children receive #N Spawn of a Cuck#! (-2 to all six skills). #V Taunt the Cuck#! is available before Dominion and can provoke a non-fatal honor duel or a public refusal, creating another route to Cuck Experience."

  domcom.700.t: "The Network Opens"
  domcom.700.desc: "[domcom_intelligence_subject.GetShortUINamePossessive] network has yielded what it knows. Every currently reachable secret belonging to [domcom_intelligence_subject.GetHerHim], [domcom_intelligence_subject.GetHerHis] vassals and sub-vassals—and, for a King or Emperor, [domcom_intelligence_subject.GetHerHis] court—has been revealed to me.\n\n#high Knowing a secret is leverage, not yet a hook.#! I can now use CK3's #bold Blackmail#! interaction on a character whose secret I know; eligible secrets can then be converted into hooks according to the normal game rules."
  domcom.700.a: "Knowledge first. Leverage next."
