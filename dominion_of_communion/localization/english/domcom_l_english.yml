  DOMCOM_UI_MAINTENANCE_TITLE: "Maintenance"
  DOMCOM_UI_MAINTENANCE_DESC: "Development/recovery tools. Rebuild preserves stored measurements; Reroll replaces every adult male measurement in the world."
  DOMCOM_UI_REBUILD_DISPLAY: "Rebuild Endowment Display"
  DOMCOM_UI_REBUILD_DISPLAY_TT: "Recompute categories and synchronized traits from the measurements already saved. Sizes do not change."
  DOMCOM_UI_REROLL_ENDOWMENTS: "Reroll All Endowments"
  DOMCOM_UI_REROLL_ENDOWMENTS_TT: "Destructive: discard every stored Endowment measurement and generate new ones."
  DOMCOM_UI_REBUILD_DONE_TOAST: "Endowment display rebuilt"
 domcom.801.t: "Seen — and Unstopped"
 domcom.801.desc: "The household saw enough to understand what happened. Yet when the confrontation came, I was too dangerous, too prepared, or simply too difficult to corner. The scandal remains; their ability to punish me does not."
 domcom.801.a: "Let them remember who walked away."
 domcom.802.t: "Caught and Cornered"
 domcom.802.desc: "This time witnesses were only the beginning. The confrontation turned against me, and the household had enough strength, nerve, or cunning to impose consequences. Where they possess legal authority, imprisonment may follow for either participant."
 domcom.802.a: "This one went badly."
 domcom.900.t: "Reroll Every Endowment?"
 domcom.900.desc: "This permanently discards every stored Dominion length and girth measurement and generates new ones across the world. Use Rebuild Endowment Display instead if you only changed icons, category thresholds, or compatibility mapping."
 domcom.900.a: "Yes. Reroll everything."
 domcom.900.a.tt: "#N Every existing Dominion Endowment measurement will change.#!"
 domcom.900.b: "Cancel."
 domcom_intimacy_discreet_modifier: "Practiced Discretion"
 domcom_intimacy_discreet_modifier_desc: "Careful clandestine intimacy has sharpened this character's Intrigue and situational command."
 domcom_intimacy_open_modifier: "Calculated Audacity"
 domcom_intimacy_open_modifier_desc: "Getting away with an openly risky liaison has sharpened this character's Intrigue and Martial confidence."
 domcom_intimacy_brazen_modifier: "Brazen Ascendancy"
 domcom_intimacy_brazen_modifier_desc: "A deliberately provocative liaison has reinforced this character's Martial confidence and Prowess."
 domcom_intimacy_prevailed_modifier: "Prevailed When Confronted"
 domcom_intimacy_prevailed_modifier_desc: "Even after discovery, this character won the confrontation and walked away."
 domcom_intimacy_cornered_modifier: "Cornered in Scandal"
 domcom_intimacy_cornered_modifier_desc: "Discovery ended in a lost confrontation, undermining this character's confidence for a time."

 domcom_intimacy_enforcer_modifier: "Defended the Household"
 domcom_intimacy_enforcer_modifier_desc: "Catching and overcoming a brazen intruder has sharpened this character's Martial confidence, Intrigue, and Prowess for a time."
