l_english:
  domcom_alpha_check_interaction: "Alpha Check"
  domcom_alpha_check_interaction_desc: "Challenge [recipient.GetShortUIName] as a peer/rival. Alpha Checks are dominance contests between characters of the same sex; sexual attraction and Endowment no longer determine eligibility or chance. Before cuck evidence exists, victory marks the rival Outclassed and opens access to their household without making them obedient. After they are Cucked, victory reinforces Dominion and adds Cuck Experience. Rank, fame, dread, diplomacy, intrigue, prowess, military strength, personality, prior Outclassing, and Cuck Experience all matter."
  domcom_alpha_check_success_toast: "Alpha Check Won"
  domcom_alpha_check_failure_toast: "They Still Resist"

  domcom_tantalize_interaction: "Tantalize"
  domcom_tantalize_interaction_desc: "Test [recipient.GetShortUINamePossessive] attraction and draw [recipient.GetHerHim] further into my influence. Tantalize follows actual mutual sexual orientation rather than sex alone, so eligible targets change naturally for heterosexual, homosexual, bisexual, and asexual characters. Each target also has persistent individual preferences for Endowment, build, age, culture, heritage, beauty, intellect, prowess, status, and personality. Attraction changes receptiveness but remains separate from Obedience. Success adds Obedience instead of immediately creating control. At 1000/1000, [recipient.GetShortUIName] becomes my Pet."
  domcom_tantalize_success_toast: "Tantalization Succeeds"
  domcom_tantalize_failure_toast: "Tantalization Rebuffed"
  domcom_pet_created_toast: "A New Pet"

  domcom_inspect_obedience_interaction: "Inspect Obedience"
  domcom_inspect_obedience_interaction_desc: "Review [recipient.GetShortUINamePossessive] Tantalize progression.\n\nObedience: #V [GuiScope.SetRoot(recipient.MakeScope).ScriptValue('domcom_obedience_display_value')|0] / 1000#!\n\nAt 1000, [recipient.GetShortUIName] becomes a permanent Pet and receives the numbered Slave of your dynasty moniker."

  domcom_inspect_dominion_interaction: "Inspect Dominion"
  domcom_inspect_dominion_interaction_desc: "Review [recipient.GetShortUINamePossessive] standing under the Communion.\n\nCuck Experience: #V [GuiScope.SetRoot(recipient.MakeScope).ScriptValue('domcom_cuck_xp_display_value')|0] / 1000#!\n\nAt 1000, the subject reaches final collapse."

  domcom_embarrass_through_relative_interaction: "Embarrass Their Cuck"
  domcom_embarrass_through_relative_interaction_desc: "Use my established relationship with [recipient.GetShortUIName] to publicly deepen the humiliation of an Owned spouse or close relative. Only characters age 18 or older can participate in this interaction. Repeated humiliations add Cuck Experience; humiliating royalty yields more."
  domcom_public_humiliation_toast: "A Public Humiliation"

  domcom_acknowledge_blood_interaction: "Acknowledge My Blood"
  domcom_acknowledge_blood_interaction_desc: "Publicly acknowledge [recipient.GetShortUIName] as mine and bring [recipient.GetHerHim] into my House. If [recipient.GetSheHe] was an Owned cuck's primary heir immediately beforehand, Dominion preserves that displaced succession claim for Demand Abdication for My Blood. Public exposure can also provoke an AI cuck into repudiating, imprisoning, or—rarely—murdering the child."
  domcom_acknowledge_blood_toast: "My Blood Is Acknowledged"
  domcom_blood_heir_recorded_toast: "A Displaced Heir Is Recorded"
  domcom_blood_heir_repudiated_toast: "The Cuck Repudiates Your Child"
  domcom_blood_heir_imprisoned_toast: "Your Child Is Seized"
  domcom_blood_heir_murdered_toast: "Blood Answered With Blood"
  domcom_blood_heir_repudiated_opinion: "Repudiated as an Heir"
  domcom_blood_heir_persecuted_opinion: "Persecuted After Acknowledgment"

  domcom_cucked_modifier: "Cucked"
  domcom_cucked_modifier_desc: "This character's household has been sexually displaced by another ruler. Public stigma lowers general and attraction opinion, while Seduce, Romance, and Elope schemes progress more slowly."
  domcom_owned_modifier: "Owned"
  domcom_owned_modifier_desc: "This character has failed an Alpha Check and lives under Dominion: #N -25% Diplomacy#! and #N -25 Attraction Opinion#!. They pay 22% of positive monthly income to their patron (30% under Household Dominion), surrender their intelligence network, and are strongly disinclined to resist their patron politically or militarily."
  domcom_humiliated_stage_modifier: "Humiliated"
  domcom_humiliated_stage_modifier_desc: "Cuck Experience: below 250. The humiliation is real, but resistance remains."
  domcom_submissive_stage_modifier: "Submissive"
  domcom_submissive_stage_modifier_desc: "Cuck Experience: 250–499. Resistance is beginning to bend."
  domcom_broken_stage_modifier: "Broken"
  domcom_broken_stage_modifier_desc: "Cuck Experience: 500–749. The subject's social confidence is collapsing."
  domcom_abject_stage_modifier: "Abject"
  domcom_abject_stage_modifier_desc: "Cuck Experience: 750–999. Only final collapse remains."
  domcom_royal_dominion_modifier: "Royal Dominion"
  domcom_royal_dominion_modifier_desc: "The humiliation of a king or emperor is a political fact, not merely a private scandal. Their court and vassal network are exposed to the patron."

  domcom_cucked_partner_opinion: "Compromised My Household"
  domcom_cucked_child_opinion: "Living Proof of My Humiliation"
  domcom_owned_by_patron_opinion: "Bound by Dominion"
  domcom_resisted_alpha_opinion: "Tried to Own Me"
  domcom_public_humiliation_target_opinion: "Publicly Humiliated My Lord"
  domcom_public_humiliation_patron_opinion: "Dominant Presence"
  domcom_acknowledged_blood_opinion: "Acknowledged My Blood"

  domcom.100.t: "Final Collapse"
  domcom.100.desc: "[domcom_collapsing_subject.GetShortUIName] has endured the full weight of the Communion. Tribute, scandal, exposure, and repeated humiliation have brought [domcom_collapsing_subject.GetHerHim] to the end of resistance.\n\nI may take what remains — or leave [domcom_collapsing_subject.GetHerHim] to choose oblivion."
  domcom.100.a: "Everything [domcom_collapsing_subject.GetSheHe] has is mine."
  domcom.100.b: "Leave [domcom_collapsing_subject.GetHerHim] to despair."

  domcom.200.t: "Drawn to the Communion"
  domcom.200.desc: "[domcom_admirer.GetShortUIName] has been unable to ignore the change in [domcom_admirer.GetHerHis] family.\n\nWhat began as fascination has become an unmistakable invitation.\n\n[domcom_admirer.GetSheHe|U] asks for a private night with me."
  domcom.200.desc.kin: "[domcom_admirer.GetShortUIName] has been unable to ignore the change in [domcom_admirer.GetHerHis] family. It came to them through [domcom_crush_source.GetShortUIName], and [domcom_admirer.GetSheHe] has watched it work.\n\nWhat began as fascination has become an unmistakable invitation.\n\n[domcom_admirer.GetSheHe|U] asks for a private night with me."
  domcom.200.a: "Receive [domcom_admirer.GetHerHim]."
  domcom.200.b: "No. This goes no further."

  domcom_open_communion_decision: "Open the Communion Ledger"
  domcom_open_communion_decision_desc: "Open the private register through which I keep account of compromised households, those brought under Dominion, blood awaiting acknowledgment, and the wider web that now bends toward me."
  domcom_open_communion_decision_tooltip: "Open the #V Dominion of Communion#! management ledger.\n\n#weak The Communion opens to a patron at 18. Until then its ledger keeps its own counsel.#!"
  domcom_open_communion_decision_confirm: "Open the Ledger"

  DOMCOM_UI_TITLE: "Dominion of Communion"
  DOMCOM_UI_SUBTITLE: "A private register of scandal, blood, tribute, and submission"
  DOMCOM_UI_CLOSE: "Close"
  DOMCOM_UI_REFRESH: "Refresh Ledger"
  DOMCOM_UI_REFRESH_TT: "Rebuild every roster from the current save. This also recovers older cuck situations where CK3 still retains persistent evidence."
  DOMCOM_UI_PAGE_OVERVIEW: "Overview"
  DOMCOM_UI_PAGE_CUCKED: "Cucked"
  DOMCOM_UI_PAGE_OWNED: "Owned"
  DOMCOM_UI_PAGE_PROSPECTS: "Dynastic Prospects"
  DOMCOM_UI_PAGE_BLOOD: "Children of Communion"
  DOMCOM_UI_PAGE_SECRETS: "Secrets & Tribute"
  DOMCOM_UI_PAGE_LEDGER: "Ledger"
  DOMCOM_UI_SIDEBAR_NOTE: "Portrait right-click interactions remain available. The ledger is the place to remember who matters and why."

  DOMCOM_UI_OVERVIEW_TITLE: "The Communion"
  DOMCOM_UI_OVERVIEW_FLAVOR: "Private scandal is useful only while it can still be remembered. Here the households touched by my rule are reduced to an account: who has been humiliated, who has submitted, whose blood is mine, and which family lines now look toward me."
  DOMCOM_UI_OVERVIEW_ROSTER: "Current Register"
  DOMCOM_UI_OVERVIEW_COUNTS: "#V My Cucked:#! [GetPlayer.MakeScope.Var('domcom_ui_cucked_count').GetValue|0]   •   #V World Cucks:#! [GetPlayer.MakeScope.Var('domcom_ui_world_cuck_count').GetValue|0]\n#V Owned:#! [GetPlayer.MakeScope.Var('domcom_ui_owned_count').GetValue|0]   (#V Royal:#! [GetPlayer.MakeScope.Var('domcom_ui_royal_owned_count').GetValue|0])\n#V Subjects in Household Dominion:#! [GetPlayer.MakeScope.Var('domcom_ui_household_count').GetValue|0]\n#V Dynastic Prospects:#! [GetPlayer.MakeScope.Var('domcom_ui_prospect_count').GetValue|0]\n#V Children awaiting acknowledgment:#! [GetPlayer.MakeScope.Var('domcom_ui_blood_count').GetValue|0]"
  DOMCOM_UI_OVERVIEW_RULE: "The Measure of Dominion"
  DOMCOM_UI_OVERVIEW_RULE_TEXT: "An affair is the opening, not the purchase price. #V Alpha Check#! weighs Cuck Experience, rank, fame, dread, diplomacy, intrigue, prowess, military strength, and temperament. Humiliation therefore matters twice: first as the proof that the household has been compromised, and later as leverage when resistance is tested."
  DOMCOM_UI_VIEW_CUCKED: "Review the Cucked"
  DOMCOM_UI_VIEW_OWNED: "Review Dominion"
  DOMCOM_UI_VIEW_BLOOD: "Review My Blood"
  DOMCOM_UI_RETRO_NOTE: "#P Opening or refreshing this ledger performs a one-time save scan. Old lover/soulmate relations and recorded biological children can therefore be recognized even if they predate the mod. Encounters that left no persistent CK3 state cannot be reconstructed.#!"

  DOMCOM_UI_CUCKED_TITLE: "Cucked Households"
  DOMCOM_UI_CUCKED_FLAVOR: "These characters have persistent evidence that their household has been displaced by me. Their experience is not equal: a lover, a soulmate, and repeated children each deepen the accumulated humiliation and make later resistance less certain."
  DOMCOM_UI_CUCKED_SCALE: "#V 0–249#! Humiliated   •   #V 250–499#! Submissive   •   #V 500–749#! Broken   •   #V 750–999#! Abject   •   #V 1000#! Final Collapse"
  DOMCOM_UI_CUCK_LINK_SOULMATE: "Through: #V [Character.MakeScope.Var('domcom_ui_compromised_partner').GetCharacter.GetUIName]#! — Soulmate"
  DOMCOM_UI_CUCK_LINK_LOVER: "Through: #V [Character.MakeScope.Var('domcom_ui_compromised_partner').GetCharacter.GetUIName]#! — Lover"
  DOMCOM_UI_CUCK_LINK_BOUND: "Through: #V [Character.MakeScope.Var('domcom_ui_compromised_partner').GetCharacter.GetUIName]#! — Dominion intimate #weak(repairable)#!"
  DOMCOM_UI_CUCK_LINK_BLOOD: "Through: #V [Character.MakeScope.Var('domcom_ui_compromised_partner').GetCharacter.GetUIName]#! — blood/parentage"
  DOMCOM_UI_CUCK_LINK_HISTORICAL: "Through: #V [Character.MakeScope.Var('domcom_ui_compromised_partner').GetCharacter.GetUIName]#! — historical household link"
  DOMCOM_UI_CUCK_LINK_NONE: "Through: #weak no current household partner could be reconstructed#!"
  DOMCOM_UI_ALPHA_CHANCE_LABEL: "Alpha Check"
  DOMCOM_UI_ALPHA_CHECK: "Alpha Check"
  DOMCOM_UI_ALPHA_CHECK_TT: "Attempt the same Alpha Check available from the portrait interaction menu. The displayed percentage is rebuilt from the current character state whenever the ledger refreshes."
  DOMCOM_UI_CUCKED_RIGHTCLICK_NOTE: "Cuck XP is one source of leverage, not the only way to Alpha Check. Alpha is a same-sex rivalry contest within diplomatic range; sexual attraction and Endowment do not determine Alpha eligibility or chance. Existing Cuck evidence upgrades a successful check into full Dominion; otherwise it establishes Dominance. The Gauntlet still uses the tracked Cucked roster."

  DOMCOM_UI_OWNED_TITLE: "Subjects Under Dominion"
  DOMCOM_UI_OWNED_FLAVOR: "These characters have failed the Alpha Check. Their submission is persistent: they pay tribute, surrender intelligence, and remain exposed to the permanent leverage held by my dynasty. Royal subjects carry additional political value."
  DOMCOM_UI_OWNED_COUNTS: "Owned subjects: #V [GetPlayer.MakeScope.Var('domcom_ui_owned_count').GetValue|0]#!   •   Kings and Emperors: #V [GetPlayer.MakeScope.Var('domcom_ui_royal_owned_count').GetValue|0]#!"
  DOMCOM_UI_TRIBUTE_LABEL: "Monthly Tribute"
  DOMCOM_UI_REFRESH_SECRETS: "Extract Secrets"
  DOMCOM_UI_REFRESH_SECRETS_TT: "Immediately force this Owned subject to disclose every secret currently available through their Dominion network. Monthly intelligence sharing continues automatically."
  DOMCOM_UI_COLLAPSE: "Collapse"
  DOMCOM_UI_COLLAPSE_TT: "Available at 1000 Cuck Experience if the monthly pulse has not already opened the Final Collapse event."
  DOMCOM_UI_OWNED_RIGHTCLICK_NOTE: "Use #V Embarrass#! here to choose an eligible spouse or relative automatically, or right-click an eligible adult Crush/Lover/Soulmate spouse or relative and use #V Embarrass Their Cuck#! directly."
  DOMCOM_UI_INTELLIGENCE_REFRESHED: "Secrets Extracted"

  DOMCOM_UI_PROSPECTS_TITLE: "Dynastic Prospects"
  DOMCOM_UI_PROSPECTS_FLAVOR: "Relatives no longer fall for the patron automatically. Two to five days after a successful Alpha Check, each eligible adult relative makes an attraction check using mutual orientation, temperament, the patron's standing, and the household's accumulated Cuck Experience. Only successful checks appear here."
  DOMCOM_UI_PROSPECTS_COUNT: "Prospects currently registered: #V [GetPlayer.MakeScope.Var('domcom_ui_prospect_count').GetValue|0]#!"
  DOMCOM_UI_PROSPECT_ROW_NOTE: "A registered adult relative drawn toward the patron."
  DOMCOM_UI_RECEIVE: "Receive Them"
  DOMCOM_UI_RECEIVE_TT: "Bring this prospect's existing approach event forward. The player may still accept or refuse when the event opens."
  DOMCOM_UI_PROSPECTS_ORIENTATION_NOTE: "Prospects are generated by a real attraction check 2–5 days after Alpha success. Existing spouses, concubines, lovers, soulmates, and existing crushes are skipped instead of producing redundant approach events. Orientation is respected, including bisexual characters. All mod-authored romantic or sexual participation is 18+."

  DOMCOM_UI_BLOOD_TITLE: "Children of Communion"
  DOMCOM_UI_BLOOD_FLAVOR: "These living characters are recorded by CK3 as my biological or public children but remain outside my House. Hidden real-father data is included where the save retains it. Acknowledgment makes the dynastic consequence match the revealed blood."
  DOMCOM_UI_BLOOD_COUNT: "Children presently eligible for acknowledgment: #V [GetPlayer.MakeScope.Var('domcom_ui_blood_count').GetValue|0]#!"
  DOMCOM_UI_BLOOD_ROW_NOTE: "Recorded as my blood; presently outside my House."
  DOMCOM_UI_ACKNOWLEDGE: "Acknowledge My Blood"
  DOMCOM_UI_ACKNOWLEDGE_TT: "Bring this character into my House. If CK3 records me as the hidden real father, I also become the public father."
  DOMCOM_UI_BLOOD_WARNING: "#N House membership can alter inheritance, alliances, marriage logic, and succession. Acknowledgment is intentionally immediate and should be used as a political act.#!"

  DOMCOM_UI_SECRETS_TITLE: "Secrets & Tribute"
  DOMCOM_UI_SECRETS_FLAVOR: "Dominion has two practical yields: money and intelligence. Owned subjects pay 22% of positive monthly income (30% under Household Dominion) and disclose the secrets available through their political network. Either obligation can also be enforced immediately from this page."
  DOMCOM_UI_NETWORK_ROW_NOTE: "Owned intelligence network; refreshed automatically each month."
  DOMCOM_UI_SECRETS_NOTE: "#P Extract Secrets reveals the subject's reachable intelligence network to you. It does not grant hooks by itself: Blackmail the revealed secret-holder to turn eligible secrets into hooks. Demand Tribute Now prepays one year at the current rate; monthly collection pauses for that year.#!"

  DOMCOM_UI_LEDGER_TITLE: "The Running Account"
  DOMCOM_UI_LEDGER_FLAVOR: "The rosters show the present. This page records the scale of what I have actually done while playing this character."
  DOMCOM_UI_LEDGER_ALPHA_TITLE: "Alpha Checks"
  DOMCOM_UI_LEDGER_ALPHA: "Attempts: #V [GetPlayer.MakeScope.Var('domcom_alpha_attempts').GetValue|0]#!\nSuccessful dominions: #P [GetPlayer.MakeScope.Var('domcom_alpha_successes').GetValue|0]#!\nResisted checks: #N [GetPlayer.MakeScope.Var('domcom_alpha_failures').GetValue|0]#!\n\n#V Checks remaining this quarter:#! [GetPlayer.MakeScope.ScriptValue('domcom_alpha_budget_left_value')|0] of [GetPlayer.MakeScope.ScriptValue('domcom_alpha_budget_cap_value')|0]. The Alpha Gauntlet does not draw on this allowance."
  DOMCOM_UI_LEDGER_COMMUNION_TITLE: "Communion"
  DOMCOM_UI_LEDGER_COMMUNION: "Public humiliations: #V [GetPlayer.MakeScope.Var('domcom_public_humiliations').GetValue|0]#!\nChildren acknowledged: #V [GetPlayer.MakeScope.Var('domcom_blood_acknowledged').GetValue|0]#!\nProspect nights accepted: #V [GetPlayer.MakeScope.Var('domcom_admirer_nights').GetValue|0]#!\nHouseholds brought under double Dominion: #V [GetPlayer.MakeScope.Var('domcom_households_owned').GetValue|0]#!\nDominion summons claimed: #V [GetPlayer.MakeScope.Var('domcom_summons_claimed').GetValue|0]#!\nAbdications secured for my blood: #V [GetPlayer.MakeScope.Var('domcom_abdications_for_blood').GetValue|0]#!\nFinal collapses resolved: #V [GetPlayer.MakeScope.Var('domcom_collapses_resolved').GetValue|0]#!\nTribute households offered: #V [GetPlayer.MakeScope.Var('domcom_tribute_household_count').GetValue|0]#!\nTribute refusals endured: #N [GetPlayer.MakeScope.Var('domcom_tribute_refusal_count').GetValue|0]#!"
  DOMCOM_UI_LEDGER_NOTE: "This first ledger records durable counters rather than a line-by-line event chronicle. Right-click interactions and GUI actions increment the same account, so using one interface does not create a separate progression system."
  # Dominion Ascendant
  domcom_household_dominion_modifier: "Household Dominion"
  domcom_household_dominion_modifier_desc: "Both spouses in this marriage answer to the same patron. Their household is compromised as a unit: additional Cuck Experience is applied and each Owned spouse pays 30% of positive monthly income instead of 22%."
  domcom_household_dominion_toast: "The Whole Household Bends"
  domcom_summons_toast: "A Private Summons Claimed"

  domcom_demand_abdication_for_blood_interaction: "Demand Abdication for My Blood"
  domcom_demand_abdication_for_blood_interaction_desc: "Demand that [recipient.GetShortUIName] surrender [recipient.GetHerHis] titles to the acknowledged child Dominion records as [recipient.GetHerHis] blood successor. If acknowledgment displaced that child from vanilla succession, the demand still remains available. Very young successors are much harder to impose; Cuck Experience and Household Dominion make surrender more likely, while repudiation or imprisonment of the child makes it harder."
  domcom_abdication_success_toast: "My Blood Takes the Throne"
  domcom_abdication_failure_toast: "They Cling to the Throne"

  domcom.310.t: "Acknowledge All My Blood"
  domcom.310.desc: "The Ledger contains several living children whose recorded blood is mine but whose House still says otherwise. I can acknowledge all of them at once. This may alter inheritance, alliances, marriage plans, and succession across several realms immediately.\n\nIf one was an Owned subject's heir, Dominion records that displaced succession before changing parentage—but public exposure may provoke retaliation from the cuck."
  domcom.310.a: "Acknowledge every eligible child."
  domcom.310.b: "Not yet."

  domcom.320.t: "Choose the Instrument"
  domcom.320.desc: "[domcom_gui_humiliated_cuck.GetShortUIName] is already under my Dominion.\n\nThe humiliation can be made public through someone close enough to make the insult unmistakable."
  domcom.320.a: "Use an eligible spouse."
  domcom.320.b: "Use an eligible relative."
  domcom.320.c: "Not now."

  domcom.400.t: "Submission Before Battle"
  domcom.400.desc: "[domcom_war_subject.GetShortUIName] has entered open war against the very patron to whom [domcom_war_subject.GetSheHe] already submitted. Before blood is wasted, [domcom_war_subject.GetSheHe] offers terms.\n\nI can demand surrender, accept a bloodless peace, or insist that the war be fought normally."
  domcom.400.a: "Then surrender."
  domcom.400.b: "White peace will suffice."
  domcom.400.c: "No. Let the armies decide it."

  rule_domcom_ai_behavior: "Dominion AI"
  setting_domcom_ai_off: "Player Only"
  setting_domcom_ai_off_desc: "AI rulers will not initiate Dominion mechanics. Existing AI subjects still obey Dominion already established over them."
  setting_domcom_ai_notable: "Notable Rulers"
  setting_domcom_ai_notable_desc: "Default. AI kings, emperors, and rulers with strongly suitable personalities may pursue Dominion. This limits background processing while allowing the system to exist beyond the player."
  setting_domcom_ai_all: "All Eligible Rulers"
  setting_domcom_ai_all_desc: "Any eligible adult AI ruler may pursue Dominion. This creates a more active world and may increase simulation work."

  DOMCOM_UI_PAGE_HELP: "How to Use"
  DOMCOM_UI_EMBARRASS: "Embarrass"
  DOMCOM_UI_EMBARRASS_TT: "Act on this Owned subject directly. An event will let me use an eligible adult spouse or eligible adult relative who is already my Crush, Lover, or Soulmate."
  DOMCOM_UI_ABDICATE: "Abdicate"
  DOMCOM_UI_ABDICATE_TT: "Available when this Owned ruler has a valid acknowledged blood successor in my House. Dominion preserves a child who was their primary heir immediately before acknowledgment even if CK3 then removes the child from vanilla succession. Cuck XP, Household Dominion, the successor's age, repudiation, and imprisonment affect acceptance."
  DOMCOM_UI_ACKNOWLEDGE_ALL: "Acknowledge All"
  DOMCOM_UI_ACKNOWLEDGE_ALL_TT: "Open a confirmation event to bring every currently eligible Child of Communion into my House at once."

  DOMCOM_UI_HELP_TITLE: "How Dominion Works"
  DOMCOM_UI_HELP_QUICK: "#V QUICK REFERENCE#!\n#P Alpha Check:#! right-click an eligible same-sex adult rival → Alpha Check. Attraction and Endowment are not part of Alpha. Existing cuck evidence makes a victory full Dominion; without it, the victory establishes personal Dominance.\n#P Tantalize:#! right-click an adult who is mutually orientation-compatible → Tantalize. Personal attraction and Endowment compatibility affect this separate Obedience track; 1000 Obedience creates a Pet.\n#P Cucked roster:#! tracks established cuck situations, Cuck XP, Alpha chance, filters, skills, and the Alpha Gauntlet. Every recognized victim is publicly nicknamed #N the Cucked#!.\n#P Alpha Gauntlet:#! Cucked → Run Alpha Gauntlet. Hardest/lowest chance first; first failure stops the run. A perfect clear grants Dominion Unchallenged for five years.\n#P Taunt:#! before Dominion, right-click your Cucked victim → Taunt the Cuck. They may defend their honor or back down; either can change Cuck XP.\n#P Crowned Union:#! a reigning Queen or Empress fully won as your Pet can be pressed to leave her husband and marry you. Nearby AI Queens can very rarely make the same proposal on their own when strongly attracted and temperamentally willing.\n#P Blood:#! Children of Communion → Acknowledge or Acknowledge All. If acknowledgment displaces your child from an Owned ruler's succession, Dominion records that claim for Blood Abdication. AI Patrons can press the same demand against a player; a successful pressure roll becomes a personal duel challenge, and refusing it starts a Blood Succession War.\n#P Money/intelligence:#! Secrets & Tribute → Extract Secrets or Demand Tribute Now.\n#P Endowment:#! male profiles are persistent and weighted toward ordinary sizes; hidden preferences affect attraction and Tantalize, never Alpha."
  DOMCOM_UI_HELP_FLOW_TITLE: "From Affair to Dominion"
  DOMCOM_UI_HELP_FLOW: "#V 1. Alpha is rivalry, not seduction.#! You do not need cuck evidence before attempting an Alpha Check. Eligible targets are same-sex adult rivals in range. Rank, prestige, dread, military power, Diplomacy, Intrigue, Prowess, personality, existing Cuck XP, and prior dominance shape the contest; sexual attraction and Endowment do not.\n\n#V 2. Tantalize is the attraction track.#! Mutual orientation opens Tantalize. Personal compatibility — including Endowment where relevant — affects success and Obedience gain. At 1000 Obedience the target becomes a Pet.\n\n#V 3. Cuck evidence still matters.#! Lover/Soulmate relationships or recorded children with another adult's spouse create the Cucked state. Recognition gives the victim the moniker the Cucked and marks their actual biological children with Spawn of a Cuck. Winning Alpha against a Cucked target establishes full Dominion; winning without cuck evidence creates Dominance instead.\n\n#V 4. Reverse Alpha is possible.#! A lower-status character can overcome a superior through personal ability and standing. Success against a higher landed tier grants a special ten-year Reverse Alpha reputation.\n\n#V 5. Family attraction is checked, never automatic.#! After a successful relevant result, eligible adult relatives make individual attraction checks. Existing spouses, concubines, lovers, soulmates, and existing crushes are skipped.\n\n#V 6. Owned subjects can be exploited.#! They pay tribute, reveal intelligence, submit in direct wars, can be publicly humiliated, and can be pressured to abdicate when your acknowledged child is their current heir or a displaced heir Dominion recorded at acknowledgment. Very young successors are harder to impose, and an exposed cuck may repudiate, imprison, or rarely kill the child. Household Dominion raises tribute to 30%.\n\n#V 7. Terminal submission is terminal.#! At 1000 Cuck XP, Final Collapse resolves only once. Lower-status external subjects surrender personal Prestige; intimate partners resolve as Absolute Devotion; two fully collapsed spouses under the same Household Dominion resolve together."
  DOMCOM_UI_HELP_SPECIAL_TITLE: "Special Rules"
  DOMCOM_UI_HELP_SPECIAL: "#V Endowment Index:#! every adult male receives a persistent weighted profile. Extreme results are deliberately rare. Characters attracted to men receive ranked private size preferences, and size matters only when orientation already permits attraction. Endowment influences attraction/Tantalize, never Alpha.\n\n#V Crowned Union:#! a female ruler of King tier or above who reaches Pet-level obedience to you can be directly pressed to leave her current husband and marry you, provided the pair is otherwise eligible and her capital is no more than five county-border steps from your sub-realm. Separately, a nearby AI Queen/Empress with very high compatibility and an impulsive, lustful, ambitious, deceitful, arbitrary, brave, or similarly action-oriented temperament may rarely propose the same break herself. Rejections impose a long cooldown to prevent spam.\n\n#V Household Dominion:#! owning both spouses raises tribute to 30%. If both reach terminal Cuck XP under the same Patron, their final state resolves once as a household.\n\n#V Dominion Summons:#! detectable marital conception in a compromised household can be interpreted as the spouse summoning the Patron. Pregnancy/birth state is used where CK3 exposes it; the mod does not claim to intercept every sex scene from every DLC or third-party event.\n\n#V Imperial Tribute:#! Emperors and independent Kings may summon a Tribute Season. The roster is frozen at the start, one direct landed vassal appears every 30–90 days, and the Imperial Tribute tab explains the exact numerical result of each form of tribute.\n\n#V AI Dominion:#! enabled AI rulers use the same core ownership, Alpha, tribute, intelligence, humiliation, succession, war-submission and Tribute Court state. General AI Alpha attempts remain limited to yearly playable-ruler pulses for performance. All mod-authored sexual/romantic participation is 18+."
  # Court of Tribute
  domcom_summon_imperial_tribute_decision: "Summon the Court to Tribute"
  domcom_summon_imperial_tribute_decision_desc: "Call the rulers beneath me to court and require each to choose how they will acknowledge the order above them. Gold, soldiers, prestige, dynastic access, or the household itself may be offered; refusal will be remembered."
  domcom_summon_imperial_tribute_decision_tooltip: "Begin an Imperial Tribute season. Direct landed vassals are summoned one by one over the coming months."
  domcom_summon_imperial_tribute_decision_confirm: "Open the Tribute Court"

  domcom_imperial_gold_tribute_modifier: "Imperial Gold Tribute"
  domcom_imperial_gold_tribute_modifier_desc: "This ruler has accepted an increased tax obligation to the hegemon for five years."
  domcom_imperial_military_tribute_modifier: "Imperial Military Tribute"
  domcom_imperial_military_tribute_modifier_desc: "This ruler has accepted a greater levy obligation to the hegemon for five years."
  domcom_imperial_favor_modifier: "Imperial Favor"
  domcom_imperial_favor_modifier_desc: "Compliance at the Tribute Court has brought this ruler into the hegemon's favor."
  domcom_imperial_defiant_modifier: "Defiant Before the Throne"
  domcom_imperial_defiant_modifier_desc: "This ruler publicly refused the Tribute Court and bears the political cost of defiance."

  domcom.510.t: "Tribute Before the Throne"
  domcom.510.desc: "[domcom_tribute_patron.GetShortUIName] has opened a season of tribute and summoned me before the court. I am expected to make visible what place I occupy beneath the throne.\n\nThe form of submission is mine to choose — as is the danger of refusing altogether."
  domcom.510.a: "I will yield greater taxes."
  domcom.510.b: "Let my prestige adorn the throne."
  domcom.510.c: "My soldiers will answer more readily."
  domcom.510.d: "My dynasty and its secrets are open to the court."
  domcom.510.e: "I offer my household to the sovereign's favor."
  domcom.510.f: "I owe no such tribute."

  domcom.520.t: "A Household Offered"
  domcom.520.desc: "[domcom_tribute_vassal.GetShortUIName] has chosen the most intimate form of submission. [domcom_household_offering.GetShortUIName] comes willingly into my private company, turning a public ceremony of hierarchy into something far more personal.\n\nAny marriage compromised by the offering now feeds directly into Dominion."
  domcom.520.a: "The court will remember this."

  domcom.530.t: "The Tribute Season Concludes"
  domcom.530.desc: "The last petitioner has come and gone.\n\nThe court now has an account of who paid, who served, who opened their dynasty, who offered their household, and who found enough pride to refuse."
  domcom.530.a: "Enter it in the Ledger."

  DOMCOM_UI_PAGE_IMPERIAL: "Imperial Tribute"
  DOMCOM_UI_IMPERIAL_TITLE: "The Tribute Court"
  DOMCOM_UI_IMPERIAL_FLAVOR: "A Tribute Season is a sequence of audiences with my direct landed vassals. Each waiting petitioner is one vassal who has not yet appeared. Every 30–90 days another is summoned until the roster is exhausted; the counters below record what each completed audience actually produced."
  DOMCOM_UI_IMPERIAL_STATUS: "#V Tribute roster:#! [GetPlayer.MakeScope.Var('domcom_tribute_total_count').GetValue|0] direct landed vassals\n#V Audiences completed:#! [GetPlayer.MakeScope.Var('domcom_tribute_summoned_count').GetValue|0]   •   #V Still waiting:#! [GetPlayer.MakeScope.Var('domcom_tribute_pending_count').GetValue|0]\n#V Results so far:#! Gold [GetPlayer.MakeScope.Var('domcom_tribute_gold_count').GetValue|0]   •   Prestige [GetPlayer.MakeScope.Var('domcom_tribute_prestige_count').GetValue|0]   •   Military [GetPlayer.MakeScope.Var('domcom_tribute_military_count').GetValue|0]\nDynastic [GetPlayer.MakeScope.Var('domcom_tribute_dynastic_count').GetValue|0]   •   Household [GetPlayer.MakeScope.Var('domcom_tribute_household_count').GetValue|0]   •   #N Refusals [GetPlayer.MakeScope.Var('domcom_tribute_refusal_count').GetValue|0]#!"
  DOMCOM_UI_IMPERIAL_FORMS_TITLE: "Forms of Tribute"
  DOMCOM_UI_IMPERIAL_FORMS: "#V Gold Tribute#! — that vassal gives me #P +20 percentage points of vassal tax contribution#! for #V 5 years#!; they suffer #N −30 opinion#! of me. Imperial Favor also gives them #P +10% monthly Prestige#! for 5 years.\n#V Prestige Tribute#! — the vassal immediately loses #N 200 Prestige#! and I immediately gain #P 400 Prestige#!; they gain #P +15 opinion#! and Imperial Favor.\n#V Military Tribute#! — #P +20 percentage points of vassal levy contribution#! to me for 5 years; #N −20 opinion#!; Imperial Favor.\n#V Dynastic Tribute#! — reveals the vassal's current secrets and the current secrets of all living adult children to me; I gain #P 150 Prestige#!; they gain #P +25 opinion#! and Imperial Favor.\n#V Household Tribute#! — the vassal, an eligible adult spouse, or an eligible adult child is selected by mutual attraction. The vassal gains #P 100 Prestige#!, my dynasty gains #P 25 Renown#!, and any compromised marriage feeds Cuck XP according to rank.\n#N Refusal#! — the vassal gains 100 Prestige for open defiance but suffers #N −10% monthly Prestige, −2 Diplomacy, and −100 opinion of me#! for 5 years; I gain #P 5 Dread#!."
  DOMCOM_UI_SUMMON_TRIBUTE: "Summon Tribute Court"
  DOMCOM_UI_SUMMON_TRIBUTE_TT: "Available to Emperors and independent Kings with direct landed vassals when no Tribute Season is already active and the five-year court cooldown has expired."
  DOMCOM_UI_IMPERIAL_NOTE: "#P A Tribute Season ends after every member of the starting roster has received one audience. Starting another season is blocked for five years. AI hegemons use the same system when Dominion AI is enabled, and a player vassal may be summoned by an AI ruler.#!"

