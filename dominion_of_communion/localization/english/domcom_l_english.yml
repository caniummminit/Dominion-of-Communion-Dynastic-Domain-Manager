  DOMCOM_UI_TANTALIZED_NOTE: "Sex is read from the character, so anyone the game does not record as a man or a woman still appears in the unfiltered list and is counted in the total rather than in either column. Refresh Ledger rebuilds this roster from the save, so partners tantalized before this page existed are recovered."
