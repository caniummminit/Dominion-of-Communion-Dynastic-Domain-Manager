 domcom_demand_abdication_tt_success:0 "They abdicate in favor of your recorded blood successor. The successor's age, treatment, and the subject's submission all affect this chance."
 domcom_demand_abdication_tt_failure:0 "They refuse, gaining another 100 Cuck XP for resisting you. Younger, repudiated, or imprisoned successors make refusal more likely."

 domcom_claim_crowned_union_interaction:0 "Claim Crowned Union"
 domcom_claim_crowned_union_interaction_desc:0 "Turn [recipient.GetFirstNamePossessive] complete personal submission into a royal marriage. As a reigning Queen or Empress who has become your Pet, she will leave her primary spouse and marry you if the union remains legal."
 domcom_claim_crowned_union_tt:0 "[recipient.GetFirstName] divorces [recipient.GetHerHis] primary spouse and marries you. Her capital must be within five adjacent-county steps of your sub-realm."
 domcom_crowned_union_success_toast:0 "Crowned Union: [recipient.GetFirstName] Marries You"
 domcom_crowned_union_failed_toast:0 "Crowned Union Could Not Be Completed"
 domcom.920.t:0 "A Crown Turns Toward You"
 domcom.920.desc:0 "[scope:domcom_crowned_queen.GetTitledFirstName] has allowed attraction to become intent. Despite [scope:domcom_crowned_queen.GetHerHis] existing marriage, [scope:domcom_crowned_queen.GetSheHe] proposes leaving [scope:domcom_crowned_queen.GetHerHis] primary spouse and joining [scope:domcom_crowned_queen.GetHerHis] crown to you."
 domcom.920.a:0 "Then leave your spouse and marry me."
 domcom.920.b:0 "No. Keep your crown and your marriage."
 domcom_crowned_union_betrayed_opinion:0 "Abandoned for a Crowned Union"
 domcom_crowned_union_devotion_opinion:0 "Crowned Union"
 domcom_crowned_union_rejected_opinion:0 "Rejected Royal Proposal"

 domcom.930.t:0 "Your Patron Demands the Succession"
 domcom.930.desc:0 "[scope:domcom_abdication_patron.GetTitledFirstName] has decided that submission is no longer enough. The demand is explicit: yield your realm to [scope:domcom_abdication_patron.GetHerHis] blood successor, or prove before the realm that [scope:domcom_abdication_patron.GetSheHe] cannot take it from you."
 domcom.930.a:0 "Then face me personally for the crown."
 domcom.930.a.tt:0 "A [prowess|E] duel decides the succession. Victory preserves your realm, removes 150 Cuck XP, and blocks another Blood Abdication demand from this Patron for five years. Defeat immediately transfers your non-baronial titles to the Patron's recorded Blood Successor."
 domcom.930.b:0 "I refuse your spectacle. If you want my crown, come take it."
 domcom.930.b.tt:0 "A Blood Succession War begins immediately. The attacking Patron receives +35% Army Damage, +35% Army Toughness, +35% Army Screen, and +20% Movement Speed for this war only."
 domcom_blood_duel_victory_toast:0 "The Succession Duel Is Yours"
 domcom_blood_duel_defeat_toast:0 "The Succession Duel Is Lost"
 domcom_blood_succession_war:0 "Blood Succession War"
  DOMCOM_BLOOD_SUCCESSION_WAR_NAME:0 "Blood Succession War"
 domcom_blood_succession_war_victory_desc:0 "The defender abdicates to the attacker's recorded Blood Successor."
 domcom_blood_succession_war_defeat_desc:0 "The defender keeps the realm, loses 200 Cuck XP, and gains five years of immunity from another Blood Abdication demand."
 domcom_blood_succession_war_buff:0 "Blood Succession Offensive"
 domcom_blood_succession_war_buff_desc:0 "This ruler's armies are committed to enforcing a disputed Dominion succession."

