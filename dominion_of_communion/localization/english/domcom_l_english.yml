  DOMCOM_UI_IMPERIAL_SEASON_IDLE: "No Tribute Season is running. Summoning one freezes a roster of my direct landed vassals; each is then called before me once, 30–90 days apart, until the roster is exhausted. A season cannot be summoned again until five years after the last one closed."
  DOMCOM_UI_IMPERIAL_SEASON_ACTIVE: "A season is in progress. #V [GetPlayer.MakeScope.Var('domcom_tribute_summoned_count').GetValue|0]#! of #V [GetPlayer.MakeScope.Var('domcom_tribute_total_count').GetValue|0]#! vassals have appeared; #V [GetPlayer.MakeScope.Var('domcom_tribute_pending_count').GetValue|0]#! are still waiting. The next petitioner arrives on his own schedule — there is nothing further to press here."
  DOMCOM_UI_IMPERIAL_SEASON_COOLDOWN: "The last season has closed. Another cannot be summoned yet."
  DOMCOM_UI_IMPERIAL_SEASON_RESULTS: "#V This season:#! [GetPlayer.MakeScope.Var('domcom_tribute_gold_count').GetValue|0] gold · [GetPlayer.MakeScope.Var('domcom_tribute_prestige_count').GetValue|0] favour · [GetPlayer.MakeScope.Var('domcom_tribute_military_count').GetValue|0] levies · [GetPlayer.MakeScope.Var('domcom_tribute_dynastic_count').GetValue|0] dynastic · [GetPlayer.MakeScope.Var('domcom_tribute_household_season_count').GetValue|0] household · #N [GetPlayer.MakeScope.Var('domcom_tribute_refusal_season_count').GetValue|0] refused#!"

